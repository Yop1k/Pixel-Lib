<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚃 Симулятор Трамвая</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: white;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(4px);
            border: 1px solid #444;
            user-select: none;
        }
        #weather-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid #555;
            backdrop-filter: blur(4px);
            z-index: 10;
            pointer-events: none;
            user-select: none;
        }
        #passenger-count {
            position: absolute;
            bottom: 100px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid #555;
            z-index: 10;
            backdrop-filter: blur(4px);
            pointer-events: none;
            user-select: none;
        }
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 10px 8px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-top: 1px solid #333;
            z-index: 20;
            pointer-events: auto;
            max-height: 50vh;
            overflow-y: auto;
        }
        .ctrl-btn {
            background: #2a2a2a;
            border: 1px solid #555;
            color: #eee;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 50px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            white-space: nowrap;
            touch-action: manipulation;
            user-select: none;
        }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn:hover { background: #3d3d3d; border-color: #888; }
        .ctrl-btn.active { background: #ffaa00; color: #111; border-color: #ffaa00; }
        .ctrl-btn.danger { background: #8b0000; border-color: #cc0000; }
        .ctrl-btn.danger:hover { background: #aa0000; }
        #speed-slider {
            width: 100px;
            accent-color: #ffaa00;
            cursor: pointer;
            background: transparent;
        }
        .slider-label {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a1a1a;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #444;
        }
        #settings-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 16px;
            padding: 20px 25px;
            z-index: 100;
            display: none;
            backdrop-filter: blur(12px);
            min-width: 260px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            max-width: 90vw;
        }
        #settings-panel h3 {
            margin-top: 0;
            text-align: center;
            color: #ffaa00;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            align-items: center;
            gap: 10px;
        }
        .setting-row input[type="range"] { width: 100px; }
        .close-btn {
            background: #333;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-weight: bold;
        }
        .close-btn:hover { background: #555; }
        @media (max-width: 600px) {
            .ctrl-btn { padding: 5px 10px; font-size: 11px; min-width: 40px; }
            #speed-slider { width: 70px; }
            #settings-panel { padding: 15px; min-width: 200px; }
        }
    </style>
</head>
<body>
    <div id="info">🚃 <span id="model-name">KTM-18</span></div>
    <div id="weather-indicator">☀️ Солнечно</div>
    <div id="passenger-count">👥 Пассажиры: 0</div>

    <div id="controls">
        <button class="ctrl-btn" id="toggleView">📷 Вид</button>
        <button class="ctrl-btn" id="toggleDoors">🚪 Двери</button>
        <button class="ctrl-btn" id="toggleLeft">⬅️ Лев.</button>
        <button class="ctrl-btn" id="toggleRight">➡️ Прав.</button>
        <div class="slider-label">
            <span>🐢</span>
            <input type="range" id="speed-slider" min="0" max="100" value="30">
            <span>🐇</span>
        </div>
        <button class="ctrl-btn" id="nextWeather">🌦 Погода</button>
        <button class="ctrl-btn" id="openSettings">⚙️</button>
        <button class="ctrl-btn" id="changeTram">🚃 Сменить</button>
    </div>

    <div id="settings-panel">
        <h3>⚙️ Настройки NPC</h3>
        <div class="setting-row"><span>🚗 Авто</span> <input type="range" id="carCount" min="0" max="30" value="12"></div>
        <div class="setting-row"><span>🚌 Автобусы</span> <input type="range" id="busCount" min="0" max="10" value="3"></div>
        <div class="setting-row"><span>🚃 Трамваи</span> <input type="range" id="tramCount" min="0" max="5" value="2"></div>
        <div class="setting-row"><span>👥 Пассажиры</span> <input type="range" id="passCount" min="0" max="20" value="8"></div>
        <button class="close-btn" id="closeSettings">Применить</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        
        // --- Telegram WebApp ---
        let tg = null;
        try {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
        } catch(e) {
            console.log('Не Telegram окружение');
        }

        // --- Инициализация ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 100, 300);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(10, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- Свет ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1);
        sunLight.position.set(50, 80, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.1;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -80;
        sunLight.shadow.camera.right = 80;
        sunLight.shadow.camera.top = 80;
        sunLight.shadow.camera.bottom = -80;
        scene.add(sunLight);

        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3a3a3a, 0.6);
        scene.add(hemiLight);

        // --- Переменные ---
        let isInsideView = true;
        let doorsOpen = false;
        let leftBlinker = false;
        let rightBlinker = false;
        let speed = 0.3;
        let currentWeather = 0;
        const weathers = ['☀️ Солнечно', '⛅ Облачно', '🌧 Дождь', '⛈ Гроза', '🌨 Град'];
        let passengerCount = 0;

        // --- Город ---
        function createCity() {
            const groundGeo = new THREE.PlaneGeometry(400, 400);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x2a4a2a });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            scene.add(ground);

            const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const roadMatLine = new THREE.MeshLambertMaterial({ color: 0xcccccc });

            const road1 = new THREE.Mesh(new THREE.PlaneGeometry(12, 300), roadMat);
            road1.rotation.x = -Math.PI / 2;
            road1.position.set(0, 0.01, 0);
            road1.receiveShadow = true;
            scene.add(road1);

            for (let z = -140; z < 140; z += 6) {
                const line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 2), roadMatLine);
                line.rotation.x = -Math.PI / 2;
                line.position.set(0, 0.02, z);
                scene.add(line);
            }

            const road2 = new THREE.Mesh(new THREE.PlaneGeometry(300, 12), roadMat);
            road2.rotation.x = -Math.PI / 2;
            road2.position.set(0, 0.01, 0);
            road2.receiveShadow = true;
            scene.add(road2);

            const colors = [0xa0522d, 0x8b7355, 0xcd853f, 0xbc8f8f, 0x6b5b4b];
            for (let i = 0; i < 80; i++) {
                const w = 2 + Math.random() * 4;
                const h = 2 + Math.random() * 8;
                const d = 2 + Math.random() * 4;
                const mat = new THREE.MeshLambertMaterial({ color: colors[Math.floor(Math.random() * colors.length)] });
                const building = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                const angle = Math.random() * Math.PI * 2;
                const radius = 15 + Math.random() * 40;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                building.position.set(x, h/2, z);
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
            }

            // Светофоры
            const tlMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
            const lightMatRed = new THREE.MeshLambertMaterial({ color: 0xff0000 });
            const lightMatGreen = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
            const lightMatYellow = new THREE.MeshLambertMaterial({ color: 0xffff00 });

            const tlPositions = [[-6, 0, -20], [6, 0, 20], [-20, 0, -6], [20, 0, 6]];
            tlPositions.forEach(pos => {
                const pole = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4, 0.3), tlMat);
                pole.position.set(pos[0], 2, pos[2]);
                scene.add(pole);
                
                const box = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.5, 0.5), tlMat);
                box.position.set(pos[0], 3.5, pos[2]);
                scene.add(box);
                
                const r = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), lightMatRed);
                r.position.set(pos[0] + (pos[0]>0?0.3:-0.3), 3.8, pos[2]);
                scene.add(r);
                const g = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), lightMatGreen);
                g.position.set(pos[0] + (pos[0]>0?0.3:-0.3), 3.2, pos[2]);
                scene.add(g);
            });

            // Остановки
            const stopMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
            const stopPos = [[-8, 0, -30], [8, 0, 30], [-30, 0, -8], [30, 0, 8]];
            stopPos.forEach(pos => {
                const plat = new THREE.Mesh(new THREE.BoxGeometry(2, 0.3, 3), stopMat);
                plat.position.set(pos[0], 0.15, pos[2]);
                plat.receiveShadow = true;
                scene.add(plat);
            });
        }
        createCity();

        // --- Модели трамваев ---
        const tramModels = {
            'KTM-18': { color: 0xcc3333, scale: 1, length: 3.5 },
            'KTM-8': { color: 0x3366cc, scale: 0.9, length: 3 },
            'Vityaz-M': { color: 0x33aa44, scale: 1.1, length: 4 }
        };
        let currentModel = 'KTM-18';

        function createTram(modelName = 'KTM-18') {
            const model = tramModels[modelName];
            const group = new THREE.Group();

            const bodyMat = new THREE.MeshLambertMaterial({ color: model.color });
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.2, model.length), bodyMat);
            body.position.y = 0.7;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            const cabMat = new THREE.MeshLambertMaterial({ color: 0xccccdd, transparent: true, opacity: 0.6 });
            const cab = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.6, 0.8), cabMat);
            cab.position.set(0, 1.1, model.length/2 - 0.2);
            group.add(cab);

            const lightMat = new THREE.MeshLambertMaterial({ color: 0xffdd44 });
            const l1 = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), lightMat);
            l1.position.set(-0.5, 0.6, model.length/2 + 0.1);
            group.add(l1);
            const l2 = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), lightMat);
            l2.position.set(0.5, 0.6, model.length/2 + 0.1);
            group.add(l2);

            const doorMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
            const door1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.8, 0.05), doorMat);
            door1.position.set(-0.6, 0.6, 0);
            group.add(door1);
            const door2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.8, 0.05), doorMat);
            door2.position.set(0.6, 0.6, 0);
            group.add(door2);

            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
            const wheelPos = [[-0.7, 0.1, -1.2], [0.7, 0.1, -1.2], [-0.7, 0.1, 1.2], [0.7, 0.1, 1.2]];
            wheelPos.forEach(pos => {
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.1, 8), wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                group.add(wheel);
            });

            group.scale.set(model.scale, model.scale, model.scale);
            return group;
        }

        let playerTram = createTram(currentModel);
        playerTram.position.set(0, 0.2, 15);
        playerTram.rotation.y = 0;
        scene.add(playerTram);

        // --- NPC ---
        const npcs = { cars: [], buses: [], trams: [] };

        function createCar(color = 0xffaa00) {
            const g = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.4, 0.8), new THREE.MeshLambertMaterial({ color }));
            body.position.y = 0.2;
            body.castShadow = true;
            g.add(body);
            const cab = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 0.6), new THREE.MeshLambertMaterial({ color: 0x88ccff, transparent: true, opacity: 0.5 }));
            cab.position.set(0, 0.45, -0.1);
            g.add(cab);
            const wm = new THREE.MeshLambertMaterial({ color: 0x222222 });
            [[-0.5, 0.05, -0.3], [0.5, 0.05, -0.3], [-0.5, 0.05, 0.3], [0.5, 0.05, 0.3]].forEach(p => {
                const w = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.08, 6), wm);
                w.rotation.z = Math.PI / 2;
                w.position.set(p[0], p[1], p[2]);
                g.add(w);
            });
            return g;
        }

        function createBus() {
            const g = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 0.9), new THREE.MeshLambertMaterial({ color: 0x2244aa }));
            body.position.y = 0.4;
            body.castShadow = true;
            g.add(body);
            const wm = new THREE.MeshLambertMaterial({ color: 0x222222 });
            [[-0.7, 0.1, -0.35], [0.7, 0.1, -0.35], [-0.7, 0.1, 0.35], [0.7, 0.1, 0.35]].forEach(p => {
                const w = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.08, 6), wm);
                w.rotation.z = Math.PI / 2;
                w.position.set(p[0], p[1], p[2]);
                g.add(w);
            });
            return g;
        }

        function createTramAI() {
            const g = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 2.5), new THREE.MeshLambertMaterial({ color: 0xcc6633 }));
            body.position.y = 0.6;
            body.castShadow = true;
            g.add(body);
            const wm = new THREE.MeshLambertMaterial({ color: 0x222222 });
            [[-0.6, 0.1, -1.0], [0.6, 0.1, -1.0], [-0.6, 0.1, 1.0], [0.6, 0.1, 1.0]].forEach(p => {
                const w = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.1, 6), wm);
                w.rotation.z = Math.PI / 2;
                w.position.set(p[0], p[1], p[2]);
                g.add(w);
            });
            return g;
        }

        function spawnNPC(type, count) {
            npcs[type].forEach(obj => scene.remove(obj));
            npcs[type] = [];

            const isCar = type === 'cars';
            const isBus = type === 'buses';
            const isTram = type === 'trams';
            const max = isCar ? 30 : isBus ? 10 : 5;
            const actualCount = Math.min(count, max);

            for (let i = 0; i < actualCount; i++) {
                let obj;
                if (isCar) obj = createCar(Math.floor(Math.random() * 0xffffff));
                else if (isBus) obj = createBus();
                else obj = createTramAI();
                
                const side = Math.random() > 0.5 ? 1 : -1;
                const z = (Math.random() - 0.5) * 100;
                const x = side * (2 + Math.random() * 4);
                if (isTram) {
                    obj.position.set(side * 4, 0.2, (Math.random() - 0.5) * 80);
                } else {
                    obj.position.set(x, 0.2, z);
                }
                obj.rotation.y = side > 0 ? 0 : Math.PI;
                obj.userData = { speed: (0.02 + Math.random() * 0.05) * side, side: side, type: type };
                scene.add(obj);
                npcs[type].push(obj);
            }
        }

        spawnNPC('cars', 12);
        spawnNPC('buses', 3);
        spawnNPC('trams', 2);

        // --- Пассажиры ---
        const passengerSprites = [];

        function createPassengerSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 48;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, 32, 48);
            ctx.fillStyle = '#ecf0f1';
            ctx.beginPath();
            ctx.arc(16, 16, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(8, 26, 16, 18);
            return new THREE.CanvasTexture(canvas);
        }

        function spawnPassengers(count) {
            passengerSprites.forEach(s => scene.remove(s));
            passengerSprites.length = 0;
            const positions = [[-8, 0, -30], [8, 0, 30], [-30, 0, -8], [30, 0, 8]];
            for (let i = 0; i < count; i++) {
                const pos = positions[Math.floor(Math.random() * positions.length)];
                const mat = new THREE.SpriteMaterial({ map: createPassengerSprite(), transparent: true });
                const sprite = new THREE.Sprite(mat);
                sprite.position.set(pos[0] + (Math.random()-0.5)*2, 0.8, pos[2] + (Math.random()-0.5)*2);
                sprite.scale.set(0.8, 1.2, 1);
                scene.add(sprite);
                passengerSprites.push(sprite);
            }
            passengerCount = count;
            document.getElementById('passenger-count').innerHTML = `👥 Пассажиры: ${count}`;
        }
        spawnPassengers(8);

        // --- Управление ---
        document.getElementById('toggleView').addEventListener('click', () => {
            isInsideView = !isInsideView;
            document.getElementById('toggleView').textContent = isInsideView ? '📷 Вид' : '📷 Снаружи';
        });

        document.getElementById('toggleDoors').addEventListener('click', () => {
            doorsOpen = !doorsOpen;
            document.getElementById('toggleDoors').textContent = doorsOpen ? '🚪 Открыты' : '🚪 Двери';
        });

        document.getElementById('toggleLeft').addEventListener('click', () => {
            leftBlinker = !leftBlinker;
            document.getElementById('toggleLeft').textContent = leftBlinker ? '⬅️ Лев.' : '⬅️ Лев.';
        });

        document.getElementById('toggleRight').addEventListener('click', () => {
            rightBlinker = !rightBlinker;
            document.getElementById('toggleRight').textContent = rightBlinker ? '➡️ Прав.' : '➡️ Прав.';
        });

        document.getElementById('speed-slider').addEventListener('input', (e) => {
            speed = e.target.value / 100 * 0.8;
        });

        document.getElementById('nextWeather').addEventListener('click', () => {
            currentWeather = (currentWeather + 1) % weathers.length;
            document.getElementById('weather-indicator').innerHTML = weathers[currentWeather];
            updateWeather(currentWeather);
        });

        document.getElementById('changeTram').addEventListener('click', () => {
            const models = Object.keys(tramModels);
            const idx = (models.indexOf(currentModel) + 1) % models.length;
            currentModel = models[idx];
            document.getElementById('model-name').textContent = currentModel;
            const newTram = createTram(currentModel);
            newTram.position.copy(playerTram.position);
            newTram.rotation.copy(playerTram.rotation);
            scene.remove(playerTram);
            playerTram = newTram;
            scene.add(playerTram);
        });

        document.getElementById('openSettings').addEventListener('click', () => {
            document.getElementById('settings-panel').style.display = 'block';
            document.getElementById('carCount').value = npcs.cars.length;
            document.getElementById('busCount').value = npcs.buses.length;
            document.getElementById('tramCount').value = npcs.trams.length;
            document.getElementById('passCount').value = passengerCount;
        });

        document.getElementById('closeSettings').addEventListener('click', () => {
            document.getElementById('settings-panel').style.display = 'none';
            spawnNPC('cars', parseInt(document.getElementById('carCount').value));
            spawnNPC('buses', parseInt(document.getElementById('busCount').value));
            spawnNPC('trams', parseInt(document.getElementById('tramCount').value));
            spawnPassengers(parseInt(document.getElementById('passCount').value));
        });

        // --- Погода ---
        let rainParticles, hailParticles;

        function updateWeather(index) {
            if (rainParticles) { scene.remove(rainParticles); rainParticles = null; }
            if (hailParticles) { scene.remove(hailParticles); hailParticles = null; }
            scene.background = new THREE.Color(0x87CEEB);
            if (index === 1) scene.background = new THREE.Color(0x9aa9b0);
            else if (index === 2 || index === 3 || index === 4) {
                scene.background = new THREE.Color(0x4a5a6a);
                if (index === 2 || index === 3) {
                    const geo = new THREE.BufferGeometry();
                    const count = 2000;
                    const pos = new Float32Array(count * 3);
                    for (let i = 0; i < count * 3; i += 3) {
                        pos[i] = (Math.random() - 0.5) * 200;
                        pos[i+1] = Math.random() * 50;
                        pos[i+2] = (Math.random() - 0.5) * 200;
                    }
                    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                    const mat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.2, transparent: true, opacity: 0.6 });
                    rainParticles = new THREE.Points(geo, mat);
                    scene.add(rainParticles);
                }
                if (index === 4) {
                    const geo = new THREE.BufferGeometry();
                    const count = 800;
                    const pos = new Float32Array(count * 3);
                    for (let i = 0; i < count * 3; i += 3) {
                        pos[i] = (Math.random() - 0.5) * 200;
                        pos[i+1] = Math.random() * 30;
                        pos[i+2] = (Math.random() - 0.5) * 200;
                    }
                    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                    const mat = new THREE.PointsMaterial({ color: 0xccddff, size: 0.4, transparent: true });
                    hailParticles = new THREE.Points(geo, mat);
                    scene.add(hailParticles);
                }
            }
        }

        // --- Обновление NPC ---
        function updateNPCs() {
            const allNPCs = [...npcs.cars, ...npcs.buses, ...npcs.trams];
            allNPCs.forEach(obj => {
                const speedVal = obj.userData.speed || 0.03;
                obj.position.z += speedVal;
                if (obj.position.z > 80) obj.position.z = -80;
                if (obj.position.z < -80) obj.position.z = 80;
            });
        }

        // --- Анимация ---
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            const moveSpeed = speed * 0.3;
            playerTram.position.z += moveSpeed;
            if (playerTram.position.z > 80) playerTram.position.z = -80;
            if (playerTram.position.z < -80) playerTram.position.z = 80;

            if (isInsideView) {
                const pos = new THREE.Vector3(0, 1.8, 1.8);
                pos.applyQuaternion(playerTram.quaternion);
                pos.add(playerTram.position);
                camera.position.lerp(pos, 0.1);
                const lookTarget = new THREE.Vector3(0, 0.5, 10);
                lookTarget.applyQuaternion(playerTram.quaternion);
                lookTarget.add(playerTram.position);
                camera.lookAt(lookTarget);
            } else {
                const offset = new THREE.Vector3(5, 4, 8);
                offset.applyQuaternion(playerTram.quaternion);
                const target = playerTram.position.clone().add(offset);
                camera.position.lerp(target, 0.05);
                camera.lookAt(playerTram.position);
            }

            if (rainParticles) {
                const pos = rainParticles.geometry.attributes.position.array;
                for (let i = 1; i < pos.length; i += 3) {
                    pos[i] -= 0.3;
                    pos[i-1] += 0.1;
                    if (pos[i] < -5) pos[i] = 30 + Math.random() * 20;
                    if (pos[i-2] > 100) pos[i-2] = -100;
                    if (pos[i-2] < -100) pos[i-2] = 100;
                }
                rainParticles.geometry.attributes.position.needsUpdate = true;
            }
            if (hailParticles) {
                const pos = hailParticles.geometry.attributes.position.array;
                for (let i = 1; i < pos.length; i += 3) {
                    pos[i] -= 0.2;
                    pos[i-2] += 0.05;
                    if (pos[i] < -5) pos[i] = 20 + Math.random() * 10;
                }
                hailParticles.geometry.attributes.position.needsUpdate = true;
            }

            if (currentWeather === 3 && Math.random() < 0.005) {
                scene.background = new THREE.Color(0xffffff);
                setTimeout(() => {
                    scene.background = new THREE.Color(0x4a5a6a);
                }, 100);
            }

            updateNPCs();
            renderer.render(scene, camera);
        }

        animate();

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🚃 Симулятор Трамвая запущен!');
    </script>
</body>
</html>
