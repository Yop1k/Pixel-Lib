<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Поле Чудес 3D</title>
    <style>
        /* Глобальные стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: pan-y;
        }
        #app {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 860px;
            background: radial-gradient(circle at 20% 20%, #1a1f33, #0b0e1a);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 60px rgba(0, 20, 255, 0.2);
            border-radius: 32px;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }

        /* Верхняя панель */
        .header {
            display: flex;
            justify-content: space-between;
            padding: 16px 20px 8px;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            z-index: 10;
        }
        .currency {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 215, 0, 0.15);
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            border: 1px solid #f0b90b;
        }
        .currency span {
            font-weight: 700;
            font-size: 18px;
            color: #f5d742;
        }
        .currency img {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 6px #f0b90b);
        }
        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 14px 4px 6px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .avatar {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #ff7b2b, #ff2d55);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 12px rgba(255, 45, 85, 0.5);
            transition: 0.3s;
        }
        .avatar.custom {
            background: #3a3f5c;
        }
        .username {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        /* Поле с буквами */
        .word-area {
            padding: 10px 12px 6px;
            text-align: center;
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 60px;
            margin: 8px 16px 0;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 215, 0, 0.1);
        }
        .letter-slot {
            width: 34px;
            height: 44px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            border-bottom: 3px solid rgba(255, 215, 0, 0.4);
            transition: 0.2s;
            box-shadow: 0 2px 0 #0b0e1a;
        }
        .letter-slot.revealed {
            background: rgba(255, 215, 0, 0.08);
            border-bottom-color: #f0b90b;
            color: #f5d742;
            text-shadow: 0 0 12px rgba(245, 215, 66, 0.3);
        }

        /* 3D-контейнер барабана */
        .wheel-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            margin: -10px 0;
            position: relative;
        }
        #wheel3d {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
        }
        .segment {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            clip-path: polygon(50% 50%, 50% 0%, 100% 0%);
            transform-origin: 50% 50%;
            backface-visibility: visible;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            transition: 0.1s;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
        }
        .segment span {
            transform: rotate(0deg) translateY(-40px) scale(0.9);
            display: block;
            text-align: center;
            line-height: 1.2;
        }
        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #f5d742, #b8860b);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            border: 3px solid #fff;
            box-shadow: 0 0 30px #f5d742;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 900;
            color: #0b0e1a;
        }

        /* Игровая информация */
        .info-panel {
            display: flex;
            justify-content: space-between;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            border-top: 1px solid rgba(255,215,0,0.15);
            border-bottom: 1px solid rgba(255,215,0,0.15);
            font-size: 14px;
            font-weight: 500;
        }
        .info-panel div {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge {
            background: rgba(255, 215, 0, 0.2);
            padding: 2px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        /* Кнопки и ввод */
        .controls {
            padding: 12px 16px 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(2px);
        }
        .ctrl-btn {
            background: linear-gradient(145deg, #2a2f4a, #1a1f33);
            border: none;
            color: #fff;
            font-weight: 700;
            padding: 12px 20px;
            border-radius: 60px;
            font-size: 16px;
            flex: 1;
            min-width: 80px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 0 #0b0e1a, 0 8px 16px rgba(0,0,0,0.4);
            transition: 0.08s linear;
            border: 1px solid rgba(255, 215, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0b0e1a;
        }
        .ctrl-btn.gold {
            background: linear-gradient(145deg, #f5d742, #c99c0b);
            color: #0b0e1a;
            border-color: #f5d742;
            text-shadow: 0 1px 2px rgba(255,255,200,0.6);
        }
        .ctrl-btn.gold:active {
            background: #d4a820;
        }
        .input-letter {
            width: 60px;
            height: 50px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
            color: #fff;
            outline: none;
            caret-color: #f5d742;
        }
        .input-letter:focus {
            border-color: #f5d742;
            box-shadow: 0 0 20px rgba(245, 215, 66, 0.2);
        }

        /* Кастомизация (мини-панель) */
        .customize-panel {
            display: flex;
            gap: 12px;
            padding: 6px 16px 12px;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,215,0,0.05);
        }
        .skin-item {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2a2f4a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            border: 2px solid transparent;
            transition: 0.2s;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .skin-item.active {
            border-color: #f5d742;
            box-shadow: 0 0 20px #f5d742;
            transform: scale(1.1);
        }
        .skin-item:active {
            transform: scale(0.9);
        }
        .skin-cost {
            font-size: 10px;
            background: rgba(0,0,0,0.6);
            padding: 0 6px;
            border-radius: 20px;
            margin-left: 4px;
        }

        /* сообщения */
        .toast {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            padding: 10px 24px;
            border-radius: 60px;
            border: 1px solid #f5d742;
            font-weight: 600;
            font-size: 16px;
            color: #f5d742;
            white-space: nowrap;
            z-index: 100;
            pointer-events: none;
            transition: 0.25s;
            opacity: 0;
        }
        .toast.show {
            opacity: 1;
            bottom: 140px;
        }
    </style>
</head>
<body>
<div id="app">
    <!-- Верхняя панель -->
    <div class="header">
        <div class="currency">
            <span>💰</span>
            <span id="coinDisplay">250</span>
        </div>
        <div class="profile">
            <div class="avatar" id="avatarDisplay">😎</div>
            <span class="username" id="usernameDisplay">Игрок</span>
        </div>
    </div>

    <!-- Слово -->
    <div class="word-area" id="wordArea">
        <!-- буквы генерируются js -->
    </div>

    <!-- 3D Барабан -->
    <div class="wheel-wrapper">
        <div id="wheel3d">
            <!-- сегменты генерируются js -->
            <div class="center-dot">🎯</div>
        </div>
    </div>

    <!-- Инфо -->
    <div class="info-panel">
        <div>🎯 Ход: <span id="turnIndicator">Ваш</span></div>
        <div>🏆 <span id="scoreDisplay">0</span></div>
        <div class="badge" id="multiplierDisplay">×1</div>
    </div>

    <!-- Управление -->
    <div class="controls">
        <input class="input-letter" id="letterInput" maxlength="1" placeholder="А" />
        <button class="ctrl-btn gold" id="spinBtn">🎰 Крутить</button>
        <button class="ctrl-btn" id="guessBtn">🔍 Угадать</button>
        <button class="ctrl-btn" id="resetBtn">🔄 Новое</button>
    </div>

    <!-- Кастомизация персонажей -->
    <div class="customize-panel" id="skinPanel">
        <div class="skin-item active" data-skin="😎" data-cost="0">😎</div>
        <div class="skin-item" data-skin="🧙" data-cost="100">🧙<span class="skin-cost">100</span></div>
        <div class="skin-item" data-skin="🦸" data-cost="150">🦸<span class="skin-cost">150</span></div>
        <div class="skin-item" data-skin="👾" data-cost="200">👾<span class="skin-cost">200</span></div>
        <div class="skin-item" data-skin="🤖" data-cost="250">🤖<span class="skin-cost">250</span></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toastMsg"></div>
</div>

<script>
    (function(){
        // ---------- ИГРОВЫЕ ДАННЫЕ ----------
        const WORDS = ['АВТОМОБИЛЬ', 'ПИАНИНО', 'СОКРОВИЩЕ', 'ФАНТАСТИКА', 'ЗОЛОТО', 'КОСМОС', 'ПУТЕШЕСТВИЕ', 'МЕЛОДИЯ', 'ВДОХНОВЕНИЕ'];
        let currentWord = '';
        let revealed = [];
        let score = 0;
        let multiplier = 1;
        let coins = 250;
        let currentSkin = '😎';
        let turn = 0; // 0 - игрок, 1 - соперник (имитация)
        let gameOver = false;

        // Элементы
        const wheelEl = document.getElementById('wheel3d');
        const wordArea = document.getElementById('wordArea');
        const coinDisplay = document.getElementById('coinDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const multiplierDisplay = document.getElementById('multiplierDisplay');
        const turnIndicator = document.getElementById('turnIndicator');
        const avatarDisplay = document.getElementById('avatarDisplay');
        const usernameDisplay = document.getElementById('usernameDisplay');
        const letterInput = document.getElementById('letterInput');
        const spinBtn = document.getElementById('spinBtn');
        const guessBtn = document.getElementById('guessBtn');
        const resetBtn = document.getElementById('resetBtn');
        const toast = document.getElementById('toastMsg');

        // Состояние барабана
        let currentAngle = 0;
        let spinning = false;
        // Сектора (8 шт)
        const SEGMENTS = [
            { label: '500', color: '#e74c3c', value: 500 },
            { label: 'X2', color: '#f39c12', value: 'x2' },
            { label: '200', color: '#2ecc71', value: 200 },
            { label: 'БАНК', color: '#e67e22', value: 'bankrupt' },
            { label: '100', color: '#3498db', value: 100 },
            { label: 'ПРИЗ', color: '#9b59b6', value: 'prize' },
            { label: '300', color: '#1abc9c', value: 300 },
            { label: 'ШАНС', color: '#e91e63', value: 'chance' }
        ];
        const SEG_COUNT = SEGMENTS.length;
        const segAngle = 360 / SEG_COUNT;

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        function initGame() {
            // случайное слово
            currentWord = WORDS[Math.floor(Math.random() * WORDS.length)].toUpperCase();
            revealed = new Array(currentWord.length).fill(false);
            // открываем первую букву для подсказки (редко)
            if (currentWord.length > 2) {
                const idx = Math.floor(Math.random() * currentWord.length);
                revealed[idx] = true;
            }
            score = 0;
            multiplier = 1;
            gameOver = false;
            turn = 0;
            updateUI();
            renderWord();
            renderWheel();
            toastMsg('Новая игра! Крути барабан!');
        }

        // Отрисовка слова
        function renderWord() {
            wordArea.innerHTML = '';
            for (let i = 0; i < currentWord.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'letter-slot';
                if (revealed[i]) {
                    slot.classList.add('revealed');
                    slot.textContent = currentWord[i];
                } else {
                    slot.textContent = '_';
                }
                wordArea.appendChild(slot);
            }
        }

        // Обновить UI (монеты, счет, множитель, ход)
        function updateUI() {
            coinDisplay.textContent = coins;
            scoreDisplay.textContent = score;
            multiplierDisplay.textContent = `×${multiplier}`;
            turnIndicator.textContent = turn === 0 ? 'Ваш' : 'Соперник';
            avatarDisplay.textContent = currentSkin;
            // подсветка активной скина
            document.querySelectorAll('.skin-item').forEach(el => {
                el.classList.toggle('active', el.dataset.skin === currentSkin);
            });
        }

        // Toast
        let toastTimeout = null;
        function toastMsg(text) {
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        // ---------- 3D БАРАБАН ----------
        function renderWheel() {
            wheelEl.innerHTML = '';
            // Создаем сегменты
            for (let i = 0; i < SEG_COUNT; i++) {
                const seg = document.createElement('div');
                seg.className = 'segment';
                const angle = i * segAngle;
                // clip-path полигон для сектора
                const deg = angle;
                seg.style.transform = `rotate(${deg}deg)`;
                seg.style.background = `conic-gradient(from ${deg}deg, ${SEGMENTS[i].color}, ${SEGMENTS[i].color} ${segAngle}deg, transparent ${segAngle}deg)`;
                seg.style.clipPath = `polygon(50% 50%, 50% 0%, 100% 0%)`;
                // текст внутри
                const span = document.createElement('span');
                span.textContent = SEGMENTS[i].label;
                seg.appendChild(span);
                wheelEl.appendChild(seg);
            }
            // центр
            const center = document.createElement('div');
            center.className = 'center-dot';
            center.textContent = '🎯';
            wheelEl.appendChild(center);
        }

        // Вращение
        function spinWheel() {
            if (spinning || gameOver) return;
            if (turn !== 0) {
                toastMsg('Сейчас ход соперника!');
                return;
            }
            spinning = true;
            const spins = 5 + Math.floor(Math.random() * 8);
            const extra = Math.random() * 360;
            const targetAngle = currentAngle + spins * 360 + extra;
            wheelEl.style.transform = `rotate(${targetAngle}deg)`;
            currentAngle = targetAngle;

            // Определяем сектор через 1.2с
            setTimeout(() => {
                const norm = ((targetAngle % 360) + 360) % 360;
                const segIndex = Math.floor(norm / segAngle) % SEG_COUNT;
                const seg = SEGMENTS[segIndex];
                handleSegment(seg);
                spinning = false;
            }, 1300);
        }

        // Обработка сектора
        function handleSegment(seg) {
            if (gameOver) return;
            const val = seg.value;
            if (val === 'x2') {
                multiplier = 2;
                toastMsg('X2! Следующая буква удвоит очки!');
                updateUI();
                // ход продолжается (можно крутить снова)
                return;
            } else if (val === 'bankrupt') {
                score = 0;
                multiplier = 1;
                toastMsg('Банкрот! Очки сгорели!');
                turn = 1; // переход хода
                updateUI();
                return;
            } else if (val === 'prize') {
                coins += 50;
                toastMsg('Приз! +50 монет!');
                // выбор: открыть букву или выбыть, но для простоты даём открыть
                openRandomLetter();
                updateUI();
                return;
            } else if (val === 'chance') {
                // ведущий называет самую частую букву
                const freq = getMostFrequentLetter();
                if (freq) {
                    revealLetter(freq);
                    toastMsg(`Шанс! Ведущий называет "${freq}"`);
                } else {
                    toastMsg('Шанс! Букв нет?');
                }
                updateUI();
                return;
            } else {
                // числовое значение
                const points = parseInt(val, 10);
                const earned = points * multiplier;
                // просим ввести букву
                toastMsg(`Выпало ${points} × ${multiplier} = ${earned} очков! Введите букву`);
                // Ожидаем ввод буквы
                const guessLetter = () => {
                    const letter = letterInput.value.trim().toUpperCase();
                    if (!letter || letter.length !== 1 || !/^[А-Я]$/.test(letter)) {
                        toastMsg('Введите одну русскую букву');
                        return;
                    }
                    if (revealLetter(letter)) {
                        score += earned;
                        // если буква есть, ход продолжается
                        toastMsg(`Буква "${letter}" есть! +${earned} очков`);
                        multiplier = 1;
                        // проверка победы
                        if (checkWin()) {
                            gameOver = true;
                            toastMsg('Поздравляю! Вы угадали слово! 🎉');
                            coins += 100;
                            updateUI();
                            return;
                        }
                    } else {
                        toastMsg(`Буквы "${letter}" нет! Ход переходит`);
                        turn = 1;
                        multiplier = 1;
                    }
                    updateUI();
                    letterInput.value = '';
                    document.removeEventListener('keydown', onEnter);
                };
                const onEnter = (e) => {
                    if (e.key === 'Enter') {
                        guessLetter();
                    }
                };
                document.addEventListener('keydown', onEnter);
                // также по кнопке
                guessBtn.onclick = () => {
                    guessLetter();
                    document.removeEventListener('keydown', onEnter);
                };
                // Если кликнуть крутить — отключаем обработку
                spinBtn.onclick = () => {
                    document.removeEventListener('keydown', onEnter);
                    spinWheel();
                };
                return;
            }
        }

        // Открыть случайную букву (для приза)
        function openRandomLetter() {
            const hidden = [];
            for (let i = 0; i < currentWord.length; i++) {
                if (!revealed[i]) hidden.push(i);
            }
            if (hidden.length === 0) {
                toastMsg('Все буквы уже открыты!');
                return;
            }
            const idx = hidden[Math.floor(Math.random() * hidden.length)];
            revealed[idx] = true;
            renderWord();
            if (checkWin()) {
                gameOver = true;
                toastMsg('Вы угадали слово! 🎉');
                coins += 100;
                updateUI();
            }
        }

        // Открыть конкретную букву
        function revealLetter(letter) {
            let found = false;
            for (let i = 0; i < currentWord.length; i++) {
                if (currentWord[i] === letter && !revealed[i]) {
                    revealed[i] = true;
                    found = true;
                }
            }
            if (found) {
                renderWord();
                checkWin();
                updateUI();
                return true;
            }
            return false;
        }

        // Самая частая буква в слове (не открытая)
        function getMostFrequentLetter() {
            const freq = {};
            for (let ch of currentWord) {
                if (!freq[ch]) freq[ch] = 0;
                freq[ch]++;
            }
            let best = '';
            let max = 0;
            for (let ch in freq) {
                if (freq[ch] > max && !revealed[currentWord.indexOf(ch)]) {
                    max = freq[ch];
                    best = ch;
                }
            }
            return best;
        }

        // Проверка победы
        function checkWin() {
            const allRevealed = revealed.every(v => v === true);
            if (allRevealed) {
                gameOver = true;
                toastMsg('🎉 Слово угадано! +100 монет');
                coins += 100;
                updateUI();
                return true;
            }
            return false;
        }

        // ---------- КАСТОМИЗАЦИЯ ----------
        document.querySelectorAll('.skin-item').forEach(el => {
            el.addEventListener('click', function() {
                const skin = this.dataset.skin;
                const cost = parseInt(this.dataset.cost, 10);
                if (currentSkin === skin) return;
                if (cost > coins) {
                    toastMsg(`Не хватает монет! Нужно ${cost}`);
                    return;
                }
                coins -= cost;
                currentSkin = skin;
                updateUI();
                toastMsg(`Новый образ: ${skin}`);
                // активный класс
                document.querySelectorAll('.skin-item').forEach(item => item.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // ---------- СОБЫТИЯ ----------
        spinBtn.addEventListener('click', spinWheel);

        resetBtn.addEventListener('click', function() {
            initGame();
            renderWheel();
            updateUI();
        });

        // Буква по умолчанию
        letterInput.addEventListener('input', function() {
            this.value = this.value.toUpperCase().replace(/[^А-Я]/g, '').slice(0, 1);
        });

        // Инициализация
        initGame();
        renderWheel();
        updateUI();

        // Соперник (имитация хода)
        setInterval(() => {
            if (gameOver) return;
            if (turn === 1 && !spinning) {
                // соперник "ходит" через 2-4 сек
                const letters = ['А','Е','И','О','Н','Т','С'];
                const letter = letters[Math.floor(Math.random() * letters.length)];
                const found = revealLetter(letter);
                if (found) {
                    toastMsg(`Соперник угадал "${letter}"!`);
                    // соперник получает очки (для простоты)
                    score += 50;
                } else {
                    toastMsg(`Соперник: "${letter}" нет!`);
                    turn = 0; // ход игроку
                }
                updateUI();
                if (checkWin()) {
                    toastMsg('Соперник победил! Попробуйте снова');
                    gameOver = true;
                }
            }
        }, 5000);

        // Дополнительно: если игра окончена, кнопка "Новое"
        window.initGame = initGame;

        // Корректировка при касании
    })();
</script>
</body>
</html>
