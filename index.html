<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚃 Симулятор Трамвая - Коломна</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: white;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.85);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            user-select: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #weather-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            z-index: 10;
            pointer-events: none;
            user-select: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #passenger-count {
            position: absolute;
            bottom: 110px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            backdrop-filter: blur(8px);
            pointer-events: none;
            user-select: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #speed-display {
            position: absolute;
            bottom: 110px;
            left: 10px;
            background: rgba(0,0,0,0.85);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            backdrop-filter: blur(8px);
            pointer-events: none;
            user-select: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            font-weight: bold;
            color: #ffaa00;
        }
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            padding: 10px 8px;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 20;
            pointer-events: auto;
            max-height: 55vh;
            overflow-y: auto;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #eee;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 50px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            white-space: nowrap;
            touch-action: manipulation;
            user-select: none;
            backdrop-filter: blur(4px);
        }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
        .ctrl-btn.active { background: #ffaa00; color: #111; border-color: #ffaa00; }
        .ctrl-btn.danger { background: rgba(200,0,0,0.3); border-color: rgba(200,0,0,0.4); }
        .ctrl-btn.danger:hover { background: rgba(200,0,0,0.5); }
        #speed-slider {
            width: 120px;
            accent-color: #ffaa00;
            cursor: pointer;
            background: transparent;
            height: 6px;
            border-radius: 3px;
        }
        .slider-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 4px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #settings-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20,20,35,0.95);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 25px 30px;
            z-index: 100;
            display: none;
            backdrop-filter: blur(20px);
            min-width: 280px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.9);
            max-width: 90vw;
        }
        #settings-panel h3 {
            margin-top: 0;
            text-align: center;
            color: #ffaa00;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            align-items: center;
            gap: 15px;
        }
        .setting-row input[type="range"] { 
            width: 120px;
            accent-color: #ffaa00;
        }
        .close-btn {
            background: #ffaa00;
            border: none;
            color: #111;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s;
        }
        .close-btn:hover { background: #ffbb22; transform: scale(1.02); }
        @media (max-width: 600px) {
            .ctrl-btn { padding: 6px 10px; font-size: 11px; min-width: 40px; }
            #speed-slider { width: 80px; }
            #settings-panel { padding: 20px; min-width: 200px; }
            #info { font-size: 12px; padding: 6px 12px; }
            #weather-indicator { font-size: 12px; padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <div id="info">🚃 <span id="model-name">KTM-5</span> | Коломна</div>
    <div id="weather-indicator">☀️ Солнечно</div>
    <div id="speed-display">⚡ 0 км/ч</div>
    <div id="passenger-count">👥 Пассажиры: 0</div>

    <div id="controls">
        <button class="ctrl-btn" id="toggleView">📷 Вид</button>
        <button class="ctrl-btn" id="toggleDoors">🚪 Двери</button>
        <button class="ctrl-btn" id="toggleLeft">⬅️ Лев.</button>
        <button class="ctrl-btn" id="toggleRight">➡️ Прав.</button>
        <div class="slider-label">
            <span>🐢</span>
            <input type="range" id="speed-slider" min="0" max="100" value="20">
            <span>🐇</span>
        </div>
        <button class="ctrl-btn" id="nextWeather">🌦 Погода</button>
        <button class="ctrl-btn" id="openSettings">⚙️</button>
        <button class="ctrl-btn" id="changeTram">🚃 Сменить</button>
    </div>

    <div id="settings-panel">
        <h3>⚙️ Настройки</h3>
        <div class="setting-row"><span>🚗 Автомобили</span> <input type="range" id="carCount" min="0" max="20" value="8"></div>
        <div class="setting-row"><span>🚌 Автобусы</span> <input type="range" id="busCount" min="0" max="8" value="3"></div>
        <div class="setting-row"><span>🚃 Трамваи</span> <input type="range" id="tramCount" min="0" max="4" value="2"></div>
        <div class="setting-row"><span>👥 Пассажиры</span> <input type="range" id="passCount" min="0" max="30" value="12"></div>
        <button class="close-btn" id="closeSettings">✅ Применить</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Telegram WebApp ---
        let tg = null;
        try {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
        } catch(e) {
            console.log('Не Telegram окружение');
        }

        // --- Сцена ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 200, 400);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(8, 4, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- Освещение ---
        const ambientLight = new THREE.AmbientLight(0x8899bb, 0.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(80, 100, 40);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.1;
        sunLight.shadow.camera.far = 300;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x8899ff, 0.3);
        fillLight.position.set(-50, 30, -50);
        scene.add(fillLight);

        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3a3a3a, 0.5);
        scene.add(hemiLight);

        // --- Переменные ---
        let isInsideView = true;
        let doorsOpen = false;
        let leftBlinker = false;
        let rightBlinker = false;
        let speed = 0.15;
        let currentWeather = 0;
        const weathers = ['☀️ Солнечно', '⛅ Облачно', '🌧 Дождь', '⛈ Гроза', '🌨 Снег'];
        let passengerCount = 0;
        let routeIndex = 0;
        const routes = [
            { name: 'Кольцевая', length: 300 },
            { name: 'Прямая', length: 500 },
            { name: 'Короткая', length: 200 }
        ];

        // --- Создание города Коломна ---
        function createCity() {
            // Текстурированная земля
            const groundGeo = new THREE.PlaneGeometry(500, 500);
            const groundMat = new THREE.MeshLambertMaterial({ 
                color: 0x4a7a4a,
                roughness: 0.8
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            scene.add(ground);

            // Рельсы и путь
            const railMat = new THREE.MeshLambertMaterial({ color: 0x666677, metalness: 0.6, roughness: 0.4 });
            const railMat2 = new THREE.MeshLambertMaterial({ color: 0x555566, metalness: 0.5, roughness: 0.5 });
            
            // Путь с рельсами
            for (let z = -250; z < 250; z += 1.5) {
                // Шпалы
                const sleeper = new THREE.Mesh(
                    new THREE.BoxGeometry(2.6, 0.1, 0.15),
                    new THREE.MeshLambertMaterial({ color: 0x5a3d2b, roughness: 0.9 })
                );
                sleeper.position.set(0, 0.05, z);
                sleeper.receiveShadow = true;
                scene.add(sleeper);
            }

            // Рельсы
            const railPositions = [-0.8, 0.8];
            railPositions.forEach(x => {
                const railGeo = new THREE.BoxGeometry(0.08, 0.15, 500);
                const rail = new THREE.Mesh(railGeo, railMat);
                rail.position.set(x, 0.15, 0);
                rail.castShadow = true;
                scene.add(rail);
            });

            // Дорога вдоль путей
            const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333, roughness: 0.9 });
            const road = new THREE.Mesh(new THREE.PlaneGeometry(8, 500), roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.set(6, 0.02, 0);
            road.receiveShadow = true;
            scene.add(road);

            // Разметка на дороге
            const lineMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
            for (let z = -240; z < 240; z += 10) {
                const line = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 4), lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(6, 0.05, z);
                scene.add(line);
            }

            // Здания (исторический центр Коломны)
            const buildingColors = [
                0x8a7a6a, 0x9a8a7a, 0x7a6a5a, 0xbaaa9a, 
                0x6a5a4a, 0xaa9a8a, 0x8a9a8a, 0x9a8a7a,
                0xccbbaa, 0x887766, 0x998877, 0x665544
            ];
            
            const buildingPositions = [];
            for (let i = 0; i < 120; i++) {
                let x, z, valid;
                let attempts = 0;
                do {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 8 + Math.random() * 60;
                    x = Math.cos(angle) * radius;
                    z = Math.sin(angle) * radius;
                    valid = true;
                    // Проверка на перекрытие с дорогой
                    if (Math.abs(x) < 4 && Math.abs(z) < 250) valid = false;
                    if (Math.abs(x - 6) < 3 && Math.abs(z) < 250) valid = false;
                    // Проверка на близость к другим зданиям
                    for (const pos of buildingPositions) {
                        if (Math.sqrt(Math.pow(pos.x - x, 2) + Math.pow(pos.z - z, 2)) < 4) {
                            valid = false;
                            break;
                        }
                    }
                    attempts++;
                } while (!valid && attempts < 20);

                if (valid) {
                    const w = 1.5 + Math.random() * 3;
                    const h = 2 + Math.random() * 10;
                    const d = 1.5 + Math.random() * 3;
                    const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
                    const mat = new THREE.MeshLambertMaterial({ color, roughness: 0.7 });
                    const building = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                    building.position.set(x, h/2, z);
                    building.castShadow = true;
                    building.receiveShadow = true;
                    scene.add(building);
                    buildingPositions.push({ x, z });

                    // Окна
                    if (h > 3) {
                        const windowMat = new THREE.MeshLambertMaterial({ 
                            color: 0x88ccff, 
                            emissive: 0x224466,
                            emissiveIntensity: 0.3,
                            transparent: true,
                            opacity: 0.6
                        });
                        for (let wi = 0; wi < Math.floor(h / 2.5); wi++) {
                            const windowMesh = new THREE.Mesh(
                                new THREE.PlaneGeometry(0.4, 0.6),
                                windowMat
                            );
                            windowMesh.position.set(x + (w/2 + 0.01), 0.8 + wi * 2.2, z);
                            windowMesh.rotation.y = Math.PI / 2;
                            scene.add(windowMesh);
                        }
                    }
                }
            }

            // Кремль (упрощенный)
            const wallMat = new THREE.MeshLambertMaterial({ color: 0x8a7a6a, roughness: 0.8 });
            const wallPositions = [
                [-15, -30], [15, -30], [-15, 30], [15, 30],
                [-15, -15], [15, -15], [-15, 15], [15, 15]
            ];
            wallPositions.forEach(pos => {
                const wall = new THREE.Mesh(
                    new THREE.BoxGeometry(0.8, 6, 2),
                    wallMat
                );
                wall.position.set(pos[0], 3, pos[1]);
                wall.castShadow = true;
                scene.add(wall);
                
                const tower = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.2, 1.5, 8, 8),
                    wallMat
                );
                tower.position.set(pos[0], 4, pos[1]);
                tower.castShadow = true;
                scene.add(tower);
            });

            // Остановки
            const stopMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50, roughness: 0.8 });
            const stopPositions = [
                [0, -40], [0, -20], [0, 0], [0, 20], [0, 40],
                [0, 60], [0, 80], [0, 100], [0, 120], [0, -60],
                [0, -80], [0, -100], [0, -120]
            ];
            stopPositions.forEach(pos => {
                const platform = new THREE.Mesh(
                    new THREE.BoxGeometry(2.8, 0.3, 2.5),
                    stopMat
                );
                platform.position.set(pos[0] - 2.5, 0.15, pos[1]);
                platform.receiveShadow = true;
                scene.add(platform);

                // Навес
                const roof = new THREE.Mesh(
                    new THREE.BoxGeometry(2.4, 0.1, 2.2),
                    new THREE.MeshLambertMaterial({ color: 0x4a5a6a })
                );
                roof.position.set(pos[0] - 2.5, 2.2, pos[1]);
                scene.add(roof);

                // Столбы
                const pillarMat = new THREE.MeshLambertMaterial({ color: 0x666666 });
                for (let p = -0.8; p <= 0.8; p += 1.6) {
                    const pillar = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.05, 0.05, 2, 4),
                        pillarMat
                    );
                    pillar.position.set(pos[0] - 2.5 + p, 1.1, pos[1]);
                    scene.add(pillar);
                }
            });

            // Светофоры
            const tlMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
            const lightRed = new THREE.MeshLambertMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.5 });
            const lightGreen = new THREE.MeshLambertMaterial({ color: 0x00ff00, emissive: 0x00ff00, emissiveIntensity: 0.5 });
            const lightYellow = new THREE.MeshLambertMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 0.5 });

            const tlPositions = [
                [6, 0, -30], [6, 0, 30], [-2, 0, -30], [-2, 0, 30],
                [6, 0, -60], [6, 0, 60], [-2, 0, -60], [-2, 0, 60]
            ];
            tlPositions.forEach(pos => {
                const pole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.05, 0.08, 3.5, 6),
                    tlMat
                );
                pole.position.set(pos[0], 1.8, pos[1]);
                scene.add(pole);

                const box = new THREE.Mesh(
                    new THREE.BoxGeometry(0.3, 0.8, 0.2),
                    tlMat
                );
                box.position.set(pos[0], 3.5, pos[1]);
                scene.add(box);

                // Красный
                const r = new THREE.Mesh(
                    new THREE.SphereGeometry(0.08, 6, 6),
                    lightRed
                );
                r.position.set(pos[0], 3.8, pos[1]);
                scene.add(r);

                // Желтый
                const y = new THREE.Mesh(
                    new THREE.SphereGeometry(0.08, 6, 6),
                    lightYellow
                );
                y.position.set(pos[0], 3.5, pos[1]);
                scene.add(y);

                // Зеленый
                const g = new THREE.Mesh(
                    new THREE.SphereGeometry(0.08, 6, 6),
                    lightGreen
                );
                g.position.set(pos[0], 3.2, pos[1]);
                scene.add(g);
            });
        }

        createCity();

        // --- Модели трамваев (реалистичные) ---
        const tramModels = {
            'KTM-5': { 
                color: 0xcc3333, 
                accent: 0xff6644,
                windows: 0x88ccff,
                length: 3.2,
                width: 1.6,
                height: 1.3
            },
            'KTM-8': { 
                color: 0x3366cc, 
                accent: 0x4488ff,
                windows: 0x88ddff,
                length: 3.5,
                width: 1.7,
                height: 1.4
            },
            'Vityaz-M': { 
                color: 0x33aa44, 
                accent: 0x66dd77,
                windows: 0x99eeff,
                length: 4.0,
                width: 1.8,
                height: 1.5
            },
            '71-608': {
                color: 0xdd6633,
                accent: 0xff8844,
                windows: 0x88ddff,
                length: 3.4,
                width: 1.6,
                height: 1.4
            }
        };
        let currentModel = 'KTM-5';

        function createTram(modelName = 'KTM-5') {
            const model = tramModels[modelName];
            const group = new THREE.Group();

            // Основной кузов
            const bodyMat = new THREE.MeshLambertMaterial({ 
                color: model.color,
                roughness: 0.4,
                metalness: 0.6
            });
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(model.width, model.height, model.length),
                bodyMat
            );
            body.position.y = model.height/2;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Акцентная полоса
            const accentMat = new THREE.MeshLambertMaterial({ 
                color: model.accent,
                roughness: 0.3,
                metalness: 0.5
            });
            const accent = new THREE.Mesh(
                new THREE.BoxGeometry(model.width + 0.05, 0.08, model.length - 0.4),
                accentMat
            );
            accent.position.set(0, model.height/2 + 0.1, 0);
            group.add(accent);

            // Окна
            const windowMat = new THREE.MeshLambertMaterial({
                color: model.windows,
                transparent: true,
                opacity: 0.7,
                roughness: 0.1,
                metalness: 0.3
            });
            const windowPositions = [
                [-model.width/2 - 0.01, 0, 0],
                [model.width/2 + 0.01, 0, 0]
            ];
            windowPositions.forEach(pos => {
                const windowMesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.6, 0.7),
                    windowMat
                );
                windowMesh.position.set(pos[0], model.height * 0.6, pos[2]);
                windowMesh.rotation.y = pos[0] < 0 ? Math.PI/2 : -Math.PI/2;
                group.add(windowMesh);
            });

            // Фары
            const lightMat = new THREE.MeshLambertMaterial({
                color: 0xffffaa,
                emissive: 0xffffaa,
                emissiveIntensity: 0.5
            });
            const lightPos = [[-0.4, 0.2], [0.4, 0.2]];
            lightPos.forEach(pos => {
                const light = new THREE.Mesh(
                    new THREE.SphereGeometry(0.08, 8, 8),
                    lightMat
                );
                light.position.set(pos[0], pos[1] + 0.3, model.length/2 + 0.05);
                group.add(light);
            });

            // Задние фонари
            const tailMat = new THREE.MeshLambertMaterial({
                color: 0xff0000,
                emissive: 0xff0000,
                emissiveIntensity: 0.3
            });
            lightPos.forEach(pos => {
                const light = new THREE.Mesh(
                    new THREE.SphereGeometry(0.06, 8, 8),
                    tailMat
                );
                light.position.set(pos[0], pos[1] + 0.3, -model.length/2 - 0.05);
                group.add(light);
            });

            // Двери (с двух сторон)
            const doorMat = new THREE.MeshLambertMaterial({
                color: 0x888899,
                roughness: 0.5,
                metalness: 0.3
            });
            const doorPositions = [
                [-model.width/2 - 0.01, 0.3, 0.4],
                [-model.width/2 - 0.01, 0.3, -0.4],
                [model.width/2 + 0.01, 0.3, 0.4],
                [model.width/2 + 0.01, 0.3, -0.4]
            ];
            doorPositions.forEach(pos => {
                const door = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.5, 0.8),
                    doorMat
                );
                door.position.set(pos[0], pos[1] + 0.3, pos[2]);
                door.rotation.y = pos[0] < 0 ? Math.PI/2 : -Math.PI/2;
                group.add(door);
            });

            // Колеса (тележки)
            const wheelMat = new THREE.MeshLambertMaterial({
                color: 0x222233,
                roughness: 0.8,
                metalness: 0.7
            });
            const wheelPositions = [
                [-0.5, 0.1, -1.0], [0.5, 0.1, -1.0],
                [-0.5, 0.1, 1.0], [0.5, 0.1, 1.0],
                [-0.5, 0.1, -1.4], [0.5, 0.1, -1.4],
                [-0.5, 0.1, 1.4], [0.5, 0.1, 1.4]
            ];
            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.2, 0.2, 0.12, 8),
                    wheelMat
                );
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                group.add(wheel);
            });

            // Токоприемник (пантограф)
            const pantMat = new THREE.MeshLambertMaterial({ color: 0x333344, metalness: 0.8 });
            const pantBase = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.02, 0.4), pantMat);
            pantBase.position.set(0, model.height + 0.5, 0);
            group.add(pantBase);

            const pantArm = new THREE.Mesh(
                new THREE.BoxGeometry(0.02, 0.4, 0.02),
                pantMat
            );
            pantArm.position.set(0, model.height + 0.7, 0);
            group.add(pantArm);

            const pantHead = new THREE.Mesh(
                new THREE.BoxGeometry(0.3, 0.02, 0.02),
                new THREE.MeshLambertMaterial({ color: 0x666677, metalness: 0.9 })
            );
            pantHead.position.set(0, model.height + 0.9, 0);
            group.add(pantHead);

            return group;
        }

        let playerTram = createTram(currentModel);
        playerTram.position.set(0, 0.2, 15);
        playerTram.rotation.y = 0;
        scene.add(playerTram);

        // --- NPC (реалистичный трафик) ---
        const npcs = { cars: [], buses: [], trams: [] };

        function createCar(color = 0xffaa00) {
            const g = new THREE.Group();
            const bodyMat = new THREE.MeshLambertMaterial({ color, roughness: 0.3, metalness: 0.4 });
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(1.4, 0.4, 0.9),
                bodyMat
            );
            body.position.y = 0.2;
            body.castShadow = true;
            body.receiveShadow = true;
            g.add(body);

            const cabMat = new THREE.MeshLambertMaterial({ 
                color: 0x88ccff, 
                transparent: true, 
                opacity: 0.6,
                roughness: 0.1
            });
            const cab = new THREE.Mesh(
                new THREE.BoxGeometry(1.0, 0.3, 0.6),
                cabMat
            );
            cab.position.set(0, 0.45, -0.1);
            g.add(cab);

            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222, roughness: 0.9 });
            const wheelPos = [[-0.6, 0.05, -0.35], [0.6, 0.05, -0.35], [-0.6, 0.05, 0.35], [0.6, 0.05, 0.35]];
            wheelPos.forEach(p => {
                const w = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.12, 0.12, 0.08, 8),
                    wheelMat
                );
                w.rotation.z = Math.PI / 2;
                w.position.set(p[0], p[1], p[2]);
                g.add(w);
            });

            // Фары
            const hlMat = new THREE.MeshLambertMaterial({ color: 0xffffaa, emissive: 0xffffaa, emissiveIntensity: 0.3 });
            const hl = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), hlMat);
            hl.position.set(-0.3, 0.2, 0.46);
            g.add(hl);
            const hl2 = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), hlMat);
            hl2.position.set(0.3, 0.2, 0.46);
            g.add(hl2);

            return g;
        }

        function createBus() {
            const g = new THREE.Group();
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0x2244aa, roughness: 0.5 });
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(2.0, 0.9, 1.0),
                bodyMat
            );
            body.position.y = 0.45;
            body.castShadow = true;
            body.receiveShadow = true;
            g.add(body);

            const windowMat = new THREE.MeshLambertMaterial({ 
                color: 0x88ddff, 
                transparent: true, 
                opacity: 0.5,
                roughness: 0.1
            });
            for (let i = -0.6; i <= 0.6; i += 0.4) {
                const w = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.3, 0.4),
                    windowMat
                );
                w.position.set(0, 0.6, i);
                g.add(w);
            }

            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222, roughness: 0.9 });
            const wheelPos = [[-0.8, 0.05, -0.4], [0.8, 0.05, -0.4], [-0.8, 0.05, 0.4], [0.8, 0.05, 0.4]];
            wheelPos.forEach(p => {
                const w = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.15, 0.15, 0.08, 8),
                    wheelMat
                );
                w.rotation.z = Math.PI / 2;
                w.position.set(p[0], p[1], p[2]);
                g.add(w);
            });

            return g;
        }

        function createTramAI() {
            const g = new THREE.Group();
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0xcc6633, roughness: 0.5 });
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(1.6, 1.1, 2.8),
                bodyMat
            );
            body.position.y = 0.55;
            body.castShadow = true;
            body.receiveShadow = true;
            g.add(body);

            const windowMat = new THREE.MeshLambertMaterial({ 
                color: 0x88ddff, 
                transparent: true, 
                opacity: 0.5 
            });
            for (let i = -0.8; i <= 0.8; i += 0.6) {
                const w = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.4, 0.5),
                    windowMat
                );
                w.position.set(0.81, 0.6, i);
                w.rotation.y = Math.PI / 2;
                g.add(w);
                const w2 = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.4, 0.5),
                    windowMat
                );
                w2.position.set(-0.81, 0.6, i);
                w2.rotation.y = -Math.PI / 2;
                g.add(w2);
            }

            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222, roughness: 0.9 });
            const wheelPos = [[-0.6, 0.1, -1.0], [0.6, 0.1, -1.0], [-0.6, 0.1, 1.0], [0.6, 0.1, 1.0]];
            wheelPos.forEach(p => {
                const w = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.2, 0.2, 0.1, 8),
                    wheelMat
                );
                w.rotation.z = Math.PI / 2;
                w.position.set(p[0], p[1], p[2]);
                g.add(w);
            });

            return g;
        }

        function spawnNPC(type, count) {
            npcs[type].forEach(obj => scene.remove(obj));
            npcs[type] = [];

            const isCar = type === 'cars';
            const isBus = type === 'buses';
            const isTram = type === 'trams';
            const max = isCar ? 20 : isBus ? 8 : 4;
            const actualCount = Math.min(count, max);

            for (let i = 0; i < actualCount; i++) {
                let obj;
                if (isCar) obj = createCar(Math.floor(Math.random() * 0xffffff));
                else if (isBus) obj = createBus();
                else obj = createTramAI();
                
                const side = Math.random() > 0.5 ? 1 : -1;
                const z = (Math.random() - 0.5) * 200;
                
                if (isTram) {
                    obj.position.set(side * 3.5, 0.2, z);
                    obj.rotation.y = 0;
                } else {
                    obj.position.set(6 + side * (1 + Math.random() * 2), 0.2, z);
                    obj.rotation.y = side > 0 ? 0 : Math.PI;
                }
                
                obj.userData = { 
                    speed: (0.02 + Math.random() * 0.04) * (isTram ? 0.8 : 1) * side,
                    side: side, 
                    type: type,
                    z: z
                };
                obj.castShadow = true;
                obj.receiveShadow = true;
                scene.add(obj);
                npcs[type].push(obj);
            }
        }

        spawnNPC('cars', 8);
        spawnNPC('buses', 3);
        spawnNPC('trams', 2);

        // --- Пассажиры ---
        const passengerSprites = [];

        function createPassengerSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 48;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            // Тело
            const colors = ['#2c3e50', '#34495e', '#e74c3c', '#3498db', '#2ecc71', '#f39c12'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            ctx.fillStyle = color;
            ctx.fillRect(12, 32, 24, 28);
            
            // Голова
            ctx.fillStyle = '#f5d0b8';
            ctx.beginPath();
            ctx.arc(24, 24, 12, 0, Math.PI * 2);
            ctx.fill();
            
            // Глаза
            ctx.fillStyle = '#111';
            ctx.fillRect(18, 22, 4, 4);
            ctx.fillRect(26, 22, 4, 4);
            
            // Ноги
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(14, 56, 8, 8);
            ctx.fillRect(26, 56, 8, 8);
            
            return new THREE.CanvasTexture(canvas);
        }

        function spawnPassengers(count) {
            passengerSprites.forEach(s => scene.remove(s));
            passengerSprites.length = 0;
            
            const stopPositions = [];
            for (let z = -120; z <= 120; z += 20) {
                stopPositions.push([-2.5, z]);
            }
            
            for (let i = 0; i < count; i++) {
                const pos = stopPositions[Math.floor(Math.random() * stopPositions.length)];
                const mat = new THREE.SpriteMaterial({ 
                    map: createPassengerSprite(), 
                    transparent: true,
                    depthTest: true
                });
                const sprite = new THREE.Sprite(mat);
                sprite.position.set(
                    pos[0] + (Math.random()-0.5) * 1.5, 
                    0.8, 
                    pos[1] + (Math.random()-0.5) * 1.5
                );
                sprite.scale.set(1.2, 1.6, 1);
                scene.add(sprite);
                passengerSprites.push(sprite);
            }
            passengerCount = count;
            document.getElementById('passenger-count').innerHTML = `👥 Пассажиры: ${count}`;
        }
        spawnPassengers(12);

        // --- UI Управление ---
        document.getElementById('toggleView').addEventListener('click', () => {
            isInsideView = !isInsideView;
            document.getElementById('toggleView').textContent = isInsideView ? '📷 Вид' : '📷 Снаружи';
        });

        document.getElementById('toggleDoors').addEventListener('click', () => {
            doorsOpen = !doorsOpen;
            document.getElementById('toggleDoors').textContent = doorsOpen ? '🚪 Открыты' : '🚪 Двери';
            document.getElementById('toggleDoors').className = `ctrl-btn ${doorsOpen ? 'active' : ''}`;
        });

        document.getElementById('toggleLeft').addEventListener('click', () => {
            leftBlinker = !leftBlinker;
            document.getElementById('toggleLeft').textContent = leftBlinker ? '⬅️ Лев.' : '⬅️ Лев.';
            document.getElementById('toggleLeft').className = `ctrl-btn ${leftBlinker ? 'active' : ''}`;
        });

        document.getElementById('toggleRight').addEventListener('click', () => {
            rightBlinker = !rightBlinker;
            document.getElementById('toggleRight').textContent = rightBlinker ? '➡️ Прав.' : '➡️ Прав.';
            document.getElementById('toggleRight').className = `ctrl-btn ${rightBlinker ? 'active' : ''}`;
        });

        const speedSlider = document.getElementById('speed-slider');
        speedSlider.addEventListener('input', (e) => {
            speed = e.target.value / 100 * 0.5;
            document.getElementById('speed-display').innerHTML = `⚡ ${Math.round(speed * 60)} км/ч`;
        });

        document.getElementById('nextWeather').addEventListener('click', () => {
            currentWeather = (currentWeather + 1) % weathers.length;
            document.getElementById('weather-indicator').innerHTML = weathers[currentWeather];
            updateWeather(currentWeather);
        });

        document.getElementById('changeTram').addEventListener('click', () => {
            const models = Object.keys(tramModels);
            const idx = (models.indexOf(currentModel) + 1) % models.length;
            currentModel = models[idx];
            document.getElementById('model-name').textContent = currentModel;
            const newTram = createTram(currentModel);
            newTram.position.copy(playerTram.position);
            newTram.rotation.copy(playerTram.rotation);
            scene.remove(playerTram);
            playerTram = newTram;
            scene.add(playerTram);
        });

        document.getElementById('openSettings').addEventListener('click', () => {
            document.getElementById('settings-panel').style.display = 'block';
            document.getElementById('carCount').value = npcs.cars.length;
            document.getElementById('busCount').value = npcs.buses.length;
            document.getElementById('tramCount').value = npcs.trams.length;
            document.getElementById('passCount').value = passengerCount;
        });

        document.getElementById('closeSettings').addEventListener('click', () => {
            document.getElementById('settings-panel').style.display = 'none';
            spawnNPC('cars', parseInt(document.getElementById('carCount').value));
            spawnNPC('buses', parseInt(document.getElementById('busCount').value));
            spawnNPC('trams', parseInt(document.getElementById('tramCount').value));
            spawnPassengers(parseInt(document.getElementById('passCount').value));
        });

        // --- Погода ---
        let rainParticles, snowParticles, cloudObjects = [];

        function updateWeather(index) {
            if (rainParticles) { scene.remove(rainParticles); rainParticles = null; }
            if (snowParticles) { scene.remove(snowParticles); snowParticles = null; }
            
            cloudObjects.forEach(c => scene.remove(c));
            cloudObjects = [];

            if (index === 0) {
                scene.background = new THREE.Color(0x87CEEB);
                scene.fog.color = new THREE.Color(0x87CEEB);
            } else if (index === 1) {
                scene.background = new THREE.Color(0x9aa9b0);
                scene.fog.color = new THREE.Color(0x9aa9b0);
                // Облака
                const cloudMat = new THREE.MeshLambertMaterial({ 
                    color: 0xccccdd, 
                    transparent: true, 
                    opacity: 0.7 
                });
                for (let i = 0; i < 15; i++) {
                    const cloud = new THREE.Mesh(
                        new THREE.SphereGeometry(2 + Math.random() * 4, 6, 6),
                        cloudMat
                    );
                    cloud.position.set(
                        (Math.random() - 0.5) * 200,
                        20 + Math.random() * 30,
                        (Math.random() - 0.5) * 200
                    );
                    cloud.scale.y = 0.3;
                    scene.add(cloud);
                    cloudObjects.push(cloud);
                }
            } else if (index === 2 || index === 3) {
                scene.background = new THREE.Color(0x4a5a6a);
                scene.fog.color = new THREE.Color(0x4a5a6a);
                
                // Дождь
                const geo = new THREE.BufferGeometry();
                const count = 3000;
                const pos = new Float32Array(count * 3);
                for (let i = 0; i < count * 3; i += 3) {
                    pos[i] = (Math.random() - 0.5) * 300;
                    pos[i+1] = Math.random() * 50;
                    pos[i+2] = (Math.random() - 0.5) * 300;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const mat = new THREE.PointsMaterial({ 
                    color: 0x88aaff, 
                    size: 0.15, 
                    transparent: true, 
                    opacity: 0.7,
                    blending: THREE.AdditiveBlending
                });
                rainParticles = new THREE.Points(geo, mat);
                scene.add(rainParticles);
            } else if (index === 4) {
                scene.background = new THREE.Color(0x7a8a9a);
                scene.fog.color = new THREE.Color(0x7a8a9a);
                
                // Снег
                const geo = new THREE.BufferGeometry();
                const count = 2000;
                const pos = new Float32Array(count * 3);
                for (let i = 0; i < count * 3; i += 3) {
                    pos[i] = (Math.random() - 0.5) * 300;
                    pos[i+1] = Math.random() * 40;
                    pos[i+2] = (Math.random() - 0.5) * 300;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const mat = new THREE.PointsMaterial({ 
                    color: 0xffffff, 
                    size: 0.2, 
                    transparent: true, 
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending
                });
                snowParticles = new THREE.Points(geo, mat);
                scene.add(snowParticles);
            }
        }

        // --- Обновление NPC ---
        function updateNPCs() {
            const allNPCs = [...npcs.cars, ...npcs.buses, ...npcs.trams];
            allNPCs.forEach(obj => {
                const speedVal = obj.userData.speed || 0.03;
                obj.position.z += speedVal;
                if (obj.position.z > 250) obj.position.z = -250;
                if (obj.position.z < -250) obj.position.z = 250;
            });
        }

        // --- Анимация ---
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Движение трамвая
            const moveSpeed = speed * 0.5;
            playerTram.position.z += moveSpeed;
            if (playerTram.position.z > 250) playerTram.position.z = -250;
            if (playerTram.position.z < -250) playerTram.position.z = 250;

            // Обновление камеры
            if (isInsideView) {
                const pos = new THREE.Vector3(0, 1.5, 1.5);
                pos.applyQuaternion(playerTram.quaternion);
                pos.add(playerTram.position);
                camera.position.lerp(pos, 0.15);
                const lookTarget = new THREE.Vector3(0, 0.3, 8);
                lookTarget.applyQuaternion(playerTram.quaternion);
                lookTarget.add(playerTram.position);
                camera.lookAt(lookTarget);
            } else {
                const offset = new THREE.Vector3(4, 3, 6);
                offset.applyQuaternion(playerTram.quaternion);
                const target = playerTram.position.clone().add(offset);
                camera.position.lerp(target, 0.08);
                camera.lookAt(playerTram.position);
            }

            // Погодные эффекты
            if (rainParticles) {
                const pos = rainParticles.geometry.attributes.position.array;
                for (let i = 1; i < pos.length; i += 3) {
                    pos[i] -= 0.5;
                    pos[i-1] += 0.2;
                    if (pos[i] < -5) {
                        pos[i] = 30 + Math.random() * 20;
                        pos[i-2] = (Math.random() - 0.5) * 300;
                    }
                }
                rainParticles.geometry.attributes.position.needsUpdate = true;
            }
            
            if (snowParticles) {
                const pos = snowParticles.geometry.attributes.position.array;
                for (let i = 1; i < pos.length; i += 3) {
                    pos[i] -= 0.05;
                    pos[i-2] += Math.sin(time + i) * 0.01;
                    if (pos[i] < -5) {
                        pos[i] = 30 + Math.random() * 10;
                        pos[i-2] = (Math.random() - 0.5) * 300;
                    }
                }
                snowParticles.geometry.attributes.position.needsUpdate = true;
            }

            // Гроза
            if (currentWeather === 3 && Math.random() < 0.003) {
                scene.background = new THREE.Color(0xffffff);
                setTimeout(() => {
                    scene.background = new THREE.Color(0x4a5a6a);
                }, 100);
            }

            updateNPCs();
            renderer.render(scene, camera);
        }

        animate();

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🚃 Симулятор Трамвая Коломна запущен!');
    </script>
</body>
</html>
