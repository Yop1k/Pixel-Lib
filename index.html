<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Поле Чудес 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a1a; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }
        #app { height: 100vh; width: 100vw; position: relative; }
        
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #ui-overlay > * { pointer-events: auto; }
        
        #top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #f0c040;
            flex-wrap: wrap;
            gap: 10px;
        }
        #lobby-info { display: flex; gap: 15px; align-items: center; font-size: 14px; flex-wrap: wrap; }
        #lobby-id { background: #f0c040; color: #000; padding: 4px 12px; border-radius: 20px; font-weight: bold; }
        #players-count { color: #aaa; }
        #turn-indicator { color: #f0c040; font-weight: bold; }
        #action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            background: #f0c040;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }
        .btn:hover:not(:disabled) { transform: scale(1.05); background: #ffd866; }
        .btn-secondary { background: #444; color: #fff; }
        .btn-secondary:hover:not(:disabled) { background: #555; }
        .btn-danger { background: #c0392b; color: #fff; }
        .btn-danger:hover:not(:disabled) { background: #e74c3c; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        #control-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 60px;
            border: 1px solid #f0c040;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95%;
            z-index: 10;
        }
        #word-display {
            font-size: 28px;
            letter-spacing: 8px;
            font-weight: bold;
            color: #f0c040;
            text-shadow: 0 0 20px rgba(240,192,64,0.3);
            min-width: 200px;
            text-align: center;
        }
        #current-player {
            font-size: 16px;
            color: #aaa;
            padding: 0 10px;
            background: rgba(240,192,64,0.1);
            border-radius: 12px;
            padding: 5px 15px;
        }
        #spin-btn {
            padding: 12px 30px;
            background: #f0c040;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            font-size: 18px;
            color: #000;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 30px rgba(240,192,64,0.3);
        }
        #spin-btn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 0 50px rgba(240,192,64,0.6); }
        #spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #letter-section {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #letter-section input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            border: 2px solid #f0c040;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            outline: none;
        }
        #letter-section input:focus { border-color: #ffd866; background: rgba(255,255,255,0.2); }
        #letter-section input:disabled { opacity: 0.3; cursor: not-allowed; }
        #letter-section button {
            padding: 10px 20px;
            background: #2ecc71;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
        }
        #letter-section button:hover:not(:disabled) { background: #27ae60; }
        #letter-section button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #sector-result {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            font-weight: bold;
            color: #f0c040;
            text-shadow: 0 0 40px rgba(240,192,64,0.8);
            background: rgba(0,0,0,0.8);
            padding: 30px 50px;
            border-radius: 24px;
            border: 3px solid #f0c040;
            display: none;
            z-index: 100;
            pointer-events: none;
            animation: none;
        }
        #sector-result.show {
            display: block;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: auto;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 24px;
            max-width: 500px;
            width: 90%;
            border: 2px solid #f0c040;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h2 { color: #f0c040; margin-bottom: 20px; text-align: center; }
        .modal-content p { margin: 10px 0; line-height: 1.6; color: #ccc; }
        .modal-content input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #f0c040;
            background: #0a0a1a;
            color: #fff;
            font-size: 16px;
            margin: 10px 0;
        }
        .modal-content .btn { width: 100%; padding: 12px; margin-top: 10px; }
        
        #customize-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .skin-item {
            background: #2a2a44;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .skin-item:hover { border-color: #f0c040; }
        .skin-item.selected { border-color: #f0c040; background: #3a3a5e; }
        .skin-item .price { color: #f0c040; font-size: 12px; }
        .skin-item .owned { color: #2ecc71; font-size: 12px; }
        
        @media (max-width: 768px) {
            #control-panel { flex-direction: column; padding: 15px; width: 95%; bottom: 15px; border-radius: 30px; gap: 10px; }
            #word-display { font-size: 22px; letter-spacing: 4px; min-width: auto; }
            #top-panel { flex-direction: column; padding: 10px; }
            #action-buttons { width: 100%; justify-content: center; }
            #letter-section input { width: 40px; height: 40px; font-size: 20px; }
            #sector-result { font-size: 40px; padding: 20px 30px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <canvas id="gameCanvas"></canvas>
        
        <div id="sector-result"></div>
        
        <div id="ui-overlay">
            <div id="top-panel">
                <div id="lobby-info">
                    <span>🏆 Поле Чудес</span>
                    <span id="lobby-id">Лобби: ---</span>
                    <span id="players-count">👥 1</span>
                    <span id="turn-indicator">⏳ Ожидание...</span>
                </div>
                <div id="action-buttons">
                    <button class="btn" id="createLobbyBtn">➕ Создать лобби</button>
                    <button class="btn btn-secondary" id="joinLobbyBtn">🔗 Присоединиться</button>
                    <button class="btn btn-secondary" id="customizeBtn">👕 Кастомизация</button>
                    <button class="btn btn-danger" id="resetGameBtn">🔄 Новая игра</button>
                </div>
            </div>
            
            <div id="control-panel">
                <div id="word-display">_ _ _ _ _</div>
                <div id="current-player">Игрок: ---</div>
                <button id="spin-btn" disabled>🎰 Крутить!</button>
                <div id="letter-section">
                    <input type="text" id="letterInput" maxlength="1" placeholder="А" disabled>
                    <button id="guessBtn" disabled>Назвать</button>
                </div>
            </div>
        </div>
        
        <div class="modal" id="lobbyModal">
            <div class="modal-content">
                <h2>🔗 Присоединение к лобби</h2>
                <p>Введите ID лобби для присоединения</p>
                <input type="text" id="lobbyInput" placeholder="Например: ABC123">
                <button class="btn" id="lobbyModalAction">Присоединиться</button>
                <button class="btn btn-secondary" id="closeLobbyModal">Отмена</button>
            </div>
        </div>
        
        <div class="modal" id="customizeModal">
            <div class="modal-content">
                <h2>👕 Кастомизация героя</h2>
                <p>Монеты: <span id="coinsDisplay">500</span> ⭐</p>
                <div id="customize-panel">
                    <div class="skin-item selected" data-skin="default">⭐ Стандарт <span class="owned">✅</span></div>
                    <div class="skin-item" data-skin="gold">🌟 Золотой <span class="price">100 ⭐</span></div>
                    <div class="skin-item" data-skin="knight">⚔️ Рыцарь <span class="price">200 ⭐</span></div>
                    <div class="skin-item" data-skin="wizard">🧙 Маг <span class="price">150 ⭐</span></div>
                    <div class="skin-item" data-skin="cyber">🤖 Кибер <span class="price">250 ⭐</span></div>
                    <div class="skin-item" data-skin="royal">👑 Король <span class="price">300 ⭐</span></div>
                </div>
                <button class="btn" id="applySkinBtn">Применить</button>
                <button class="btn btn-secondary" id="closeCustomizeModal">Закрыть</button>
            </div>
        </div>
        
        <div class="modal" id="infoModal">
            <div class="modal-content">
                <h2 id="infoModalTitle">Информация</h2>
                <p id="infoModalText">Текст</p>
                <button class="btn" id="closeInfoModal">ОК</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    // ============================================
    // 1. КОНФИГУРАЦИЯ - ВАШИ ДАННЫЕ
    // ============================================
    const CONFIG = {
        BIN_ID: '6a6d0e33f5f4af5e29dbb2fa', // ВАШ BIN ID
        API_KEY: '$2a$10$sa0sf5mD.2daJe70zEh8IuGxCuNdkPcSUAweK.5OduT.wLvuk.cqm', // ЗАМЕНИТЕ НА ВАШ API КЛЮЧ
        API_URL: 'https://api.jsonbin.io/v3/b'
    };

    // ============================================
    // 2. РАБОТА С БАЗОЙ ДАННЫХ
    // ============================================
    class GameDatabase {
        constructor() {
            this.binId = CONFIG.BIN_ID;
            this.apiKey = CONFIG.API_KEY;
            this.apiUrl = CONFIG.API_URL;
            this.cache = null;
        }

        async load() {
            try {
                const response = await fetch(`${this.apiUrl}/${this.binId}/latest`, {
                    headers: { 'X-Master-Key': this.apiKey }
                });
                if (!response.ok) throw new Error('Ошибка загрузки');
                const result = await response.json();
                this.cache = result.record;
                return this.cache;
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                return null;
            }
        }

        async save(data) {
            try {
                const response = await fetch(`${this.apiUrl}/${this.binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': this.apiKey
                    },
                    body: JSON.stringify({
                        ...this.cache,
                        ...data,
                        lastUpdated: new Date().toISOString()
                    })
                });
                if (!response.ok) throw new Error('Ошибка сохранения');
                const result = await response.json();
                this.cache = result.record;
                return this.cache;
            } catch (error) {
                console.error('Ошибка сохранения:', error);
                return null;
            }
        }

        async addPlayer(playerData) {
            const data = this.cache || await this.load();
            if (!data.players) data.players = [];
            
            const exists = data.players.some(p => p.name === playerData.name);
            if (!exists) {
                data.players.push({
                    ...playerData,
                    joinedAt: new Date().toISOString(),
                    stats: { gamesPlayed: 0, gamesWon: 0, totalScore: 0 }
                });
                if (data.lobby) data.lobby.currentPlayers = data.players.length;
                await this.save(data);
            }
            return data.players;
        }

        async updateGameState(gameData) {
            const data = this.cache || await this.load();
            data.currentGame = { ...data.currentGame, ...gameData };
            await this.save(data);
            return data;
        }
    }

    // ============================================
    // 3. СОСТОЯНИЕ ИГРЫ
    // ============================================
    const state = {
        lobbyId: null,
        players: [],
        currentPlayerIndex: 0,
        word: '',
        displayWord: [],
        guessedLetters: [],
        gameOver: false,
        spinInProgress: false,
        currentSkin: 'default',
        coins: 500,
        ownedSkins: ['default'],
        canGuess: false,
        multiplier: 1,
        isMyTurn: false,
        db: null,
        sectors: [
            { label: '850', value: 850, type: 'points' },
            { label: '450', value: 450, type: 'points' },
            { label: 'X2', value: 0, type: 'double' },
            { label: '750', value: 750, type: 'points' },
            { label: 'ПРИЗ', value: 0, type: 'prize' },
            { label: 'ПЛЮС', value: 0, type: 'plus' },
            { label: 'ШАНС', value: 0, type: 'chance' },
            { label: 'БАНКРОТ', value: 0, type: 'bankrupt' }
        ]
    };

    const WORDS = ['ПРИВЕТ', 'СОЛНЦЕ', 'КОМПЬЮТЕР', 'ТЕЛЕФОН', 'АВТОМОБИЛЬ', 
                   'САМОЛЕТ', 'ПОЕЗД', 'МОРЕ', 'ГОРОД', 'ШКОЛА', 'МУЗЫКА', 'КНИГА'];

    // ============================================
    // 4. ИНИЦИАЛИЗАЦИЯ БАЗЫ ДАННЫХ
    // ============================================
    async function initDatabase() {
        state.db = new GameDatabase();
        await state.db.load();
        
        // Если база пустая, создаем структуру
        if (!state.db.cache) {
            await state.db.save({
                lobbyId: null,
                players: [],
                currentGame: {
                    word: null,
                    displayWord: [],
                    guessedLetters: [],
                    currentPlayerIndex: 0,
                    round: 0,
                    gameOver: false
                },
                settings: { maxPlayers: 6, roundTime: 60, superGameTime: 60 }
            });
        }
        return state.db.cache;
    }

    // ============================================
    // 5. THREE.JS 3D СЦЕНА
    // ============================================
    const canvas = document.getElementById('gameCanvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 6, 12);
    camera.lookAt(0, 1.5, 0);
    
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    
    // Освещение
    const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
    scene.add(ambientLight);
    
    const mainLight = new THREE.DirectionalLight(0xffeedd, 1);
    mainLight.position.set(5, 10, 7);
    mainLight.castShadow = true;
    scene.add(mainLight);
    
    const fillLight = new THREE.DirectionalLight(0x4488ff, 0.5);
    fillLight.position.set(-5, 5, -5);
    scene.add(fillLight);
    
    // Пол
    const floorGeometry = new THREE.CircleGeometry(10, 32);
    const floorMaterial = new THREE.MeshStandardMaterial({ 
        color: 0x1a1a2e, 
        roughness: 0.8, 
        metalness: 0.2,
        transparent: true,
        opacity: 0.8
    });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.5;
    floor.receiveShadow = true;
    scene.add(floor);
    
    const gridHelper = new THREE.GridHelper(16, 16, 0xf0c040, 0x444466);
    gridHelper.position.y = -0.4;
    scene.add(gridHelper);

    // ============================================
    // 6. СОЗДАНИЕ БАРАБАНА
    // ============================================
    const wheelGroup = new THREE.Group();
    wheelGroup.position.set(0, 1.5, 0);
    scene.add(wheelGroup);
    
    // Основной диск
    const diskGeo = new THREE.CylinderGeometry(2.8, 2.8, 0.3, 32);
    const diskMat = new THREE.MeshStandardMaterial({ 
        color: 0x1a1a2e, 
        roughness: 0.5, 
        metalness: 0.3,
        emissive: 0x222244,
        emissiveIntensity: 0.1
    });
    const disk = new THREE.Mesh(diskGeo, diskMat);
    disk.position.y = 0;
    disk.castShadow = true;
    wheelGroup.add(disk);
    
    // Сектора
    const sectorCount = state.sectors.length;
    const segmentAngle = (Math.PI * 2) / sectorCount;
    const sectorColors = [0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff, 0x44ffff, 0xff8844, 0x88ff44];
    
    for (let i = 0; i < sectorCount; i++) {
        const angle = i * segmentAngle;
        const color = sectorColors[i % sectorColors.length];
        
        const shape = new THREE.Shape();
        const radius = 2.6;
        const innerRadius = 0.5;
        const segments = 20;
        
        shape.moveTo(0, 0);
        for (let j = 0; j <= segments; j++) {
            const theta = (j / segments) * segmentAngle;
            const r = (j === segments) ? innerRadius : radius;
            const x = Math.sin(theta) * r;
            const z = Math.cos(theta) * r;
            shape.lineTo(x, z);
        }
        shape.lineTo(0, 0);
        
        const sectorGeo = new THREE.ShapeGeometry(shape);
        const sectorMat = new THREE.MeshStandardMaterial({ 
            color: color,
            roughness: 0.3,
            metalness: 0.5,
            side: THREE.DoubleSide,
            emissive: color,
            emissiveIntensity: 0.1
        });
        const sector = new THREE.Mesh(sectorGeo, sectorMat);
        sector.rotation.x = -Math.PI / 2;
        sector.position.y = 0.05;
        sector.castShadow = true;
        
        const sectorGroup = new THREE.Group();
        sectorGroup.add(sector);
        sectorGroup.rotation.y = angle;
        wheelGroup.add(sectorGroup);
        
        // Текст
        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 128;
        labelCanvas.height = 64;
        const ctx = labelCanvas.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.roundRect(10, 10, 108, 44, 12);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 8;
        ctx.fillText(state.sectors[i].label, 64, 34);
        
        const texture = new THREE.CanvasTexture(labelCanvas);
        const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
        const sprite = new THREE.Sprite(spriteMat);
        const midAngle = angle + segmentAngle/2;
        sprite.position.set(
            Math.sin(midAngle) * 2.0,
            0.3,
            Math.cos(midAngle) * 2.0
        );
        sprite.scale.set(1.2, 0.6, 1);
        wheelGroup.add(sprite);
    }
    
    // Центр
    const centerGeo = new THREE.CircleGeometry(0.6, 16);
    const centerMat = new THREE.MeshStandardMaterial({ 
        color: 0xf0c040, 
        roughness: 0.2, 
        metalness: 0.8,
        emissive: 0xf0c040,
        emissiveIntensity: 0.3
    });
    const center = new THREE.Mesh(centerGeo, centerMat);
    center.rotation.x = -Math.PI / 2;
    center.position.y = 0.1;
    wheelGroup.add(center);
    
    // Стрелка
    const arrowGroup = new THREE.Group();
    const arrowShape = new THREE.Shape();
    arrowShape.moveTo(0, 0.8);
    arrowShape.lineTo(-0.4, -0.4);
    arrowShape.lineTo(0.4, -0.4);
    arrowShape.closePath();
    
    const arrowGeo = new THREE.ShapeGeometry(arrowShape);
    const arrowMat = new THREE.MeshStandardMaterial({ 
        color: 0xff3333, 
        emissive: 0xff0000, 
        emissiveIntensity: 0.5,
        roughness: 0.3,
        metalness: 0.1
    });
    const arrow = new THREE.Mesh(arrowGeo, arrowMat);
    arrow.position.set(0, 0.5, 2.9);
    arrow.rotation.x = -0.1;
    arrowGroup.add(arrow);
    
    const glowGeo = new THREE.SphereGeometry(0.2, 8, 8);
    const glowMat = new THREE.MeshStandardMaterial({ 
        color: 0xff0000, 
        emissive: 0xff0000, 
        emissiveIntensity: 1,
        transparent: true,
        opacity: 0.5
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.position.set(0, 0.5, 2.7);
    arrowGroup.add(glow);
    
    scene.add(arrowGroup);

    // ============================================
    // 7. 3D ГЕРОИ
    // ============================================
    const playersGroup = new THREE.Group();
    scene.add(playersGroup);
    
    function createHero(color, skinType, name, score, isActive) {
        const group = new THREE.Group();
        
        // Тело
        const bodyGeo = new THREE.CylinderGeometry(0.5, 0.6, 1.0, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6, metalness: 0.2 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.5;
        body.castShadow = true;
        group.add(body);
        
        // Голова
        const headGeo = new THREE.SphereGeometry(0.35, 8, 8);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.4 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.1;
        head.castShadow = true;
        group.add(head);
        
        // Одежда
        let outfitColor = 0x4444ff;
        switch(skinType) {
            case 'gold': outfitColor = 0xffd700; break;
            case 'knight': outfitColor = 0x888899; break;
            case 'wizard': outfitColor = 0x9944ff; break;
            case 'cyber': outfitColor = 0x00ffaa; break;
            case 'royal': outfitColor = 0xcc2244; break;
            default: outfitColor = 0x4444ff;
        }
        
        const cloakGeo = new THREE.CylinderGeometry(0.6, 0.7, 0.6, 8);
        const cloakMat = new THREE.MeshStandardMaterial({ color: outfitColor, roughness: 0.8, metalness: 0.1 });
        const cloak = new THREE.Mesh(cloakGeo, cloakMat);
        cloak.position.y = 0.5;
        cloak.scale.set(1, 1, 0.8);
        group.add(cloak);
        
        if (skinType === 'wizard' || skinType === 'royal') {
            const hatGeo = new THREE.ConeGeometry(0.4, 0.5, 6);
            const hatMat = new THREE.MeshStandardMaterial({ color: outfitColor, roughness: 0.5 });
            const hat = new THREE.Mesh(hatGeo, hatMat);
            hat.position.y = 1.3;
            hat.scale.set(1, 1, 0.7);
            group.add(hat);
        }
        
        // Имя
        const nameCanvas = document.createElement('canvas');
        nameCanvas.width = 256;
        nameCanvas.height = 64;
        const ctx2 = nameCanvas.getContext('2d');
        ctx2.fillStyle = 'rgba(0,0,0,0.6)';
        ctx2.roundRect(10, 10, 236, 44, 20);
        ctx2.fill();
        ctx2.fillStyle = isActive ? '#f0c040' : '#ffffff';
        ctx2.font = 'bold 26px Arial';
        ctx2.textAlign = 'center';
        ctx2.textBaseline = 'middle';
        ctx2.fillText(name, 128, 34);
        
        const nameTexture = new THREE.CanvasTexture(nameCanvas);
        const nameMat = new THREE.SpriteMaterial({ map: nameTexture, transparent: true });
        const nameSprite = new THREE.Sprite(nameMat);
        nameSprite.scale.set(1.8, 0.45, 1);
        nameSprite.position.y = 2.0;
        group.add(nameSprite);
        
        // Очки
        const scoreCanvas = document.createElement('canvas');
        scoreCanvas.width = 128;
        scoreCanvas.height = 64;
        const ctx3 = scoreCanvas.getContext('2d');
        ctx3.fillStyle = 'rgba(0,0,0,0.6)';
        ctx3.roundRect(10, 10, 108, 44, 15);
        ctx3.fill();
        ctx3.fillStyle = '#ffd700';
        ctx3.font = 'bold 24px Arial';
        ctx3.textAlign = 'center';
        ctx3.textBaseline = 'middle';
        ctx3.fillText(score.toString(), 64, 34);
        
        const scoreTexture = new THREE.CanvasTexture(scoreCanvas);
        const scoreMat = new THREE.SpriteMaterial({ map: scoreTexture, transparent: true });
        const scoreSprite = new THREE.Sprite(scoreMat);
        scoreSprite.scale.set(1.0, 0.5, 1);
        scoreSprite.position.y = 2.5;
        group.add(scoreSprite);
        
        // Подсветка активного игрока
        if (isActive) {
            const glowRing = new THREE.Mesh(
                new THREE.RingGeometry(0.7, 0.9, 16),
                new THREE.MeshBasicMaterial({ color: 0xf0c040, transparent: true, opacity: 0.4, side: THREE.DoubleSide })
            );
            glowRing.rotation.x = -Math.PI / 2;
            glowRing.position.y = 0.05;
            group.add(glowRing);
        }
        
        group.userData = { name, scoreSprite, nameSprite, skin: skinType };
        return group;
    }
    
    let heroMeshes = [];
    
    function updatePlayers3D() {
        while(playersGroup.children.length > 0) {
            playersGroup.remove(playersGroup.children[0]);
        }
        heroMeshes = [];
        
        const count = Math.max(1, state.players.length);
        const radius = 4.0;
        
        for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2 - Math.PI/2;
            const x = Math.sin(angle) * radius;
            const z = Math.cos(angle) * radius;
            
            const player = state.players[i] || { name: `Игрок ${i+1}`, score: 0, skin: 'default' };
            const color = new THREE.Color().setHSL((i / count) * 0.8 + 0.1, 0.7, 0.5);
            const isActive = i === state.currentPlayerIndex && !state.gameOver;
            const hero = createHero(color, player.skin || 'default', player.name, player.score || 0, isActive);
            hero.position.set(x, 0, z);
            hero.rotation.y = -angle + Math.PI/2;
            
            playersGroup.add(hero);
            heroMeshes.push(hero);
        }
    }

    // ============================================
    // 8. ЛОГИКА ИГРЫ
    // ============================================
    function initGame() {
        const wordIndex = Math.floor(Math.random() * WORDS.length);
        state.word = WORDS[wordIndex];
        state.displayWord = Array(state.word.length).fill('_');
        state.guessedLetters = [];
        state.gameOver = false;
        state.multiplier = 1;
        state.canGuess = false;
        
        state.players.forEach(p => p.score = 0);
        state.currentPlayerIndex = 0;
        
        updateWordDisplay();
        updateUI();
        updatePlayers3D();
        updateControls();
        
        showInfo('Новая игра', `Загадано слово из ${state.word.length} букв`);
        saveToDatabase();
    }
    
    function updateWordDisplay() {
        document.getElementById('word-display').textContent = state.displayWord.join(' ');
    }
    
    function updateUI() {
        const currentPlayer = state.players[state.currentPlayerIndex];
        if (currentPlayer) {
            document.getElementById('current-player').textContent = `🎯 ${currentPlayer.name}`;
            document.getElementById('turn-indicator').textContent = 
                state.gameOver ? '🏁 Игра окончена' : `⬅️ Ход ${currentPlayer.name}`;
        }
        document.getElementById('players-count').textContent = `👥 ${state.players.length}`;
        document.getElementById('lobby-id').textContent = `Лобби: ${state.lobbyId || '---'}`;
        document.getElementById('coinsDisplay').textContent = state.coins;
    }
    
    function updateControls() {
        const currentPlayer = state.players[state.currentPlayerIndex];
        const isMyTurn = currentPlayer?.name === 'Вы';
        state.isMyTurn = isMyTurn;
        
        document.getElementById('spin-btn').disabled = !isMyTurn || state.gameOver || state.spinInProgress;
        document.getElementById('letterInput').disabled = !isMyTurn || !state.canGuess || state.gameOver;
        document.getElementById('guessBtn').disabled = !isMyTurn || !state.canGuess || state.gameOver;
        
        if (isMyTurn && !state.gameOver && !state.spinInProgress) {
            document.getElementById('spin-btn').style.opacity = '1';
        }
    }
    
    function spinWheel() {
        if (state.spinInProgress || state.gameOver) return;
        if (state.players.length === 0) {
            showInfo('Ошибка', 'Нет игроков в лобби');
            return;
        }
        
        const currentPlayer = state.players[state.currentPlayerIndex];
        if (currentPlayer.name !== 'Вы') {
            showInfo('Не ваш ход', `Сейчас ход ${currentPlayer.name}`);
            return;
        }
        
        state.spinInProgress = true;
        state.canGuess = false;
        document.getElementById('spin-btn').disabled = true;
        document.getElementById('letterInput').disabled = true;
        document.getElementById('guessBtn').disabled = true;
        
        // Анимация вращения
        const targetRotation = wheelGroup.rotation.y + Math.PI * 2 * (3 + Math.random() * 4);
        const duration = 2500 + Math.random() * 1500;
        const startTime = Date.now();
        const startRotation = wheelGroup.rotation.y;
        
        function animateSpin() {
            const elapsed = Date.now() - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const ease = 1 - Math.pow(1 - progress, 3);
            wheelGroup.rotation.y = startRotation + (targetRotation - startRotation) * ease;
            
            if (progress < 1) {
                requestAnimationFrame(animateSpin);
            } else {
                // Определяем сектор
                const angle = ((wheelGroup.rotation.y % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
                const sectorIndex = Math.floor((angle / (Math.PI * 2)) * sectorCount) % sectorCount;
                state.currentSector = sectorIndex;
                const sector = state.sectors[sectorIndex];
                
                handleSectorResult(sector);
                state.spinInProgress = false;
                document.getElementById('spin-btn').disabled = false;
                updateControls();
            }
        }
        
        animateSpin();
    }
    
    function handleSectorResult(sector) {
        const currentPlayer = state.players[state.currentPlayerIndex];
        if (!currentPlayer) return;
        
        // Показываем результат
        const resultDiv = document.getElementById('sector-result');
        resultDiv.textContent = sector.label;
        resultDiv.className = 'show';
        setTimeout(() => resultDiv.className = '', 2000);
        
        switch(sector.type) {
            case 'points':
                const points = sector.value * state.multiplier;
                showInfo('🎯 Результат', `${currentPlayer.name} выиграл ${points} очков!`);
                currentPlayer.score += points;
                state.multiplier = 1;
                state.canGuess = true;
                updatePlayers3D();
                break;
                
            case 'prize':
                showInfo('🎁 Приз!', `${currentPlayer.name} выиграл приз! Открываем букву...`);
                setTimeout(() => openRandomLetter(currentPlayer), 500);
                break;
                
            case 'plus':
                showInfo('➕ Плюс', `${currentPlayer.name} может открыть любую букву!`);
                setTimeout(() => openRandomLetter(currentPlayer), 500);
                break;
                
            case 'chance':
                showInfo('🍀 Шанс', `Ведущий называет букву за ${currentPlayer.name}`);
                setTimeout(() => handleChance(currentPlayer), 500);
                break;
                
            case 'bankrupt':
                showInfo('💸 Банкрот!', `Все очки ${currentPlayer.name} сгорают!`);
                currentPlayer.score = 0;
                state.multiplier = 1;
                state.canGuess = false;
                setTimeout(() => nextTurn(), 500);
                break;
                
            case 'double':
                state.multiplier = 2;
                state.canGuess = true;
                showInfo('🔥 Х2', `Следующая буква принесет удвоенные очки!`);
                break;
        }
        
        updateUI();
        updatePlayers3D();
        updateControls();
        saveToDatabase();
        
        if (state.canGuess && !state.gameOver) {
            document.getElementById('letterInput').disabled = false;
            document.getElementById('guessBtn').disabled = false;
            document.getElementById('letterInput').focus();
        }
    }
    
    function openRandomLetter(player) {
        for (let ch of state.word) {
            if (!state.guessedLetters.includes(ch)) {
                guessLetter(ch, player);
                return;
            }
        }
        nextTurn();
    }
    
    function handleChance(player) {
        const freq = {};
        for (let ch of state.word) {
            freq[ch] = (freq[ch] || 0) + 1;
        }
        let best = '';
        let bestCount = 0;
        for (let ch in freq) {
            if (freq[ch] > bestCount && !state.guessedLetters.includes(ch)) {
                best = ch;
                bestCount = freq[ch];
            }
        }
        if (best) {
            guessLetter(best, player);
        } else {
            nextTurn();
        }
    }
    
    function guessLetter(letter, player) {
        letter = letter.toUpperCase();
        if (state.guessedLetters.includes(letter)) {
            showInfo('Повтор', 'Эта буква уже была названа');
            return;
        }
        
        state.guessedLetters.push(letter);
        
        let found = false;
        let count = 0;
        for (let i = 0; i < state.word.length; i++) {
            if (state.word[i] === letter) {
                state.displayWord[i] = letter;
                found = true;
                count++;
            }
        }
        
        if (found) {
            const points = count * 50 * state.multiplier;
            player.score += points;
            state.multiplier = 1;
            showInfo('✅ Есть!', `Буква "${letter}" есть в слове! +${points} очков`);
            updateWordDisplay();
            updatePlayers3D();
            state.canGuess = true;
            checkWin();
        } else {
            showInfo('❌ Нет', `Буквы "${letter}" нет в слове`);
            state.multiplier = 1;
            state.canGuess = false;
            setTimeout(() => nextTurn(), 500);
        }
        
        updateUI();
        updateControls();
        saveToDatabase();
        
        if (!state.gameOver && state.canGuess) {
            document.getElementById('letterInput').disabled = false;
            document.getElementById('guessBtn').disabled = false;
            document.getElementById('letterInput').focus();
        }
    }
    
    function nextTurn() {
        if (state.gameOver) return;
        state.currentPlayerIndex = (state.currentPlayerIndex + 1) % state.players.length;
        state.canGuess = false;
        document.getElementById('letterInput').value = '';
        updateUI();
        updatePlayers3D();
        updateControls();
        saveToDatabase();
    }
    
    function checkWin() {
        if (state.displayWord.join('') === state.word) {
            state.gameOver = true;
            state.canGuess = false;
            const winner = state.players[state.currentPlayerIndex];
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('letterInput').disabled = true;
            document.getElementById('guessBtn').disabled = true;
            showInfo('🏆 Победа!', `${winner.name} отгадал слово "${state.word}"!`);
            saveToDatabase();
        }
    }

    // ============================================
    // 9. РАБОТА С БАЗОЙ ДАННЫХ
    // ============================================
    async function saveToDatabase() {
        if (!state.db) return;
        await state.db.updateGameState({
            word: state.word,
            displayWord: state.displayWord,
            guessedLetters: state.guessedLetters,
            currentPlayerIndex: state.currentPlayerIndex,
            gameOver: state.gameOver,
            round: state.round || 0
        });
        await state.db.save({ players: state.players });
    }

    // ============================================
    // 10. UI ОБРАБОТЧИКИ
    // ============================================
    function showInfo(title, text) {
        document.getElementById('infoModalTitle').textContent = title;
        document.getElementById('infoModalText').textContent = text;
        document.getElementById('infoModal').classList.add('active');
    }
    
    // Создание лобби
    document.getElementById('createLobbyBtn').addEventListener('click', async () => {
        state.lobbyId = Math.random().toString(36).substring(2, 8).toUpperCase();
        state.players = [{ name: 'Вы', score: 0, skin: state.currentSkin }];
        state.currentPlayerIndex = 0;
        initGame();
        await saveToDatabase();
        document.getElementById('lobby-id').textContent = `Лобби: ${state.lobbyId}`;
        showInfo('Лобби создано', `ID лобби: ${state.lobbyId}\nПоделитесь с друзьями для присоединения!`);
    });
    
    // Присоединение к лобби
    document.getElementById('joinLobbyBtn').addEventListener('click', () => {
        document.getElementById('lobbyModal').classList.add('active');
    });
    
    document.getElementById('lobbyModalAction').addEventListener('click', async () => {
        const id = document.getElementById('lobbyInput').value.toUpperCase();
        if (id) {
            state.lobbyId = id;
            const data = await state.db.load();
            if (data && data.players) {
                state.players = data.players;
                const exists = state.players.some(p => p.name === 'Вы');
                if (!exists) {
                    state.players.push({ name: 'Вы', score: 0, skin: state.currentSkin });
                    await state.db.save({ players: state.players });
                }
                // Загружаем состояние игры
                if (data.currentGame) {
                    state.word = data.currentGame.word || WORDS[0];
                    state.displayWord = data.currentGame.displayWord || Array(state.word.length).fill('_');
                    state.guessedLetters = data.currentGame.guessedLetters || [];
                    state.currentPlayerIndex = data.currentGame.currentPlayerIndex || 0;
                    state.gameOver = data.currentGame.gameOver || false;
                }
                updateWordDisplay();
                updateUI();
                updatePlayers3D();
                updateControls();
                document.getElementById('lobbyModal').classList.remove('active');
                showInfo('Присоединено', `Вы присоединились к лобби ${state.lobbyId}`);
            }
        }
    });
    
    document.getElementById('closeLobbyModal').addEventListener('click', () => {
        document.getElementById('lobbyModal').classList.remove('active');
    });
    
    // Кастомизация
    document.getElementById('customizeBtn').addEventListener('click', () => {
        document.getElementById('customizeModal').classList.add('active');
        document.getElementById('coinsDisplay').textContent = state.coins;
    });
    
    document.querySelectorAll('.skin-item').forEach(item => {
        item.addEventListener('click', function() {
            document.querySelectorAll('.skin-item').forEach(el => el.classList.remove('selected'));
            this.classList.add('selected');
        });
    });
    
    document.getElementById('applySkinBtn').addEventListener('click', () => {
        const selected = document.querySelector('.skin-item.selected');
        if (selected) {
            const skin = selected.dataset.skin;
            if (skin !== 'default' && !state.ownedSkins.includes(skin)) {
                const priceText = selected.querySelector('.price')?.textContent || '100';
                const price = parseInt(priceText);
                if (state.coins >= price) {
                    state.coins -= price;
                    state.ownedSkins.push(skin);
                    selected.querySelector('.price').textContent = '✅ Куплено';
                } else {
                    showInfo('Недостаточно монет', `Вам нужно ${price} монет для покупки этого скина`);
                    return;
                }
            }
            state.currentSkin = skin;
            state.players.forEach(p => p.skin = skin);
            updatePlayers3D();
            saveToDatabase();
            document.getElementById('customizeModal').classList.remove('active');
            showInfo('Готово', 'Скин применен!');
        }
    });
    
    document.getElementById('closeCustomizeModal').addEventListener('click', () => {
        document.getElementById('customizeModal').classList.remove('active');
    });
    
    // Управление игрой
    document.getElementById('spin-btn').addEventListener('click', spinWheel);
    
    document.getElementById('guessBtn').addEventListener('click', () => {
        const input = document.getElementById('letterInput');
        const letter = input.value.toUpperCase();
        const player = state.players[state.currentPlayerIndex];
        if (letter && /[А-Я]/.test(letter) && player && player.name === 'Вы') {
            guessLetter(letter, player);
            input.value = '';
        } else {
            showInfo('Ошибка', 'Введите русскую букву');
        }
    });
    
    document.getElementById('letterInput').addEventListener('keyup', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('guessBtn').click();
        }
    });
    
    document.getElementById('resetGameBtn').addEventListener('click', async () => {
        if (confirm('Начать новую игру?')) {
            initGame();
            await saveToDatabase();
        }
    });
    
    document.getElementById('closeInfoModal').addEventListener('click', () => {
        document.getElementById('infoModal').classList.remove('active');
    });

    // ============================================
    // 11. АНИМАЦИЯ
    // ============================================
    function animate() {
        requestAnimationFrame(animate);
        heroMeshes.forEach(hero => {
            hero.rotation.y += 0.002;
        });
        renderer.render(scene, camera);
    }

    // ============================================
    // 12. ИНИЦИАЛИЗАЦИЯ
    // ============================================
    // Добавляем roundRect
    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (r > w/2) r = w/2;
            if (r > h/2) r = h/2;
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r);
            return this;
        };
    }
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // Запуск
    async function start() {
        await initDatabase();
        state.players = state.db.cache?.players || [{ name: 'Вы', score: 0, skin: 'default' }];
        state.word = state.db.cache?.currentGame?.word || WORDS[0];
        state.displayWord = state.db.cache?.currentGame?.displayWord || Array(state.word.length).fill('_');
        state.guessedLetters = state.db.cache?.currentGame?.guessedLetters || [];
        state.currentPlayerIndex = state.db.cache?.currentGame?.currentPlayerIndex || 0;
        state.gameOver = state.db.cache?.currentGame?.gameOver || false;
        
        updateWordDisplay();
        updateUI();
        updatePlayers3D();
        updateControls();
        animate();
        
        console.log('🎰 Поле Чудес 3D загружено!');
        console.log('📦 BIN ID:', CONFIG.BIN_ID);
        console.log('👥 Игроков:', state.players.length);
    }
    
    start();
    </script>
